<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:#0a0e1a; color:#c8d6e5; min-height:100vh; }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:#0a0e1a; }
        ::-webkit-scrollbar-thumb { background:#2d3a6e; border-radius:3px; }
        .page-header { padding:24px 30px 10px 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,255,255,.1); }
        .page-header h1 { font-size:24px; font-weight:700; background:linear-gradient(135deg,#00d2ff,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .page-header .actions { display:flex; gap:12px; align-items:center; }
        .btn-primary, .btn-secondary, .btn-danger, .btn-sm { padding:8px 20px; border:none; border-radius:6px; cursor:pointer; font-size:14px; transition:all .3s; }
        .btn-primary { background:linear-gradient(135deg,#00d2ff,#3b82f6); color:#fff; }
        .btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 15px rgba(0,210,255,.3); }
        .btn-secondary { border:1px solid rgba(0,255,255,.2); background:transparent; color:#00d2ff; }
        .btn-secondary:hover { background:rgba(0,255,255,.05); border-color:#00d2ff; }
        .btn-danger { background:linear-gradient(135deg,#ff6b6b,#ee5a24); color:#fff; }
        .btn-sm { padding:5px 12px; font-size:12px; }
        .content { padding:20px 30px; }
        .filter-bar { display:flex; gap:12px; align-items:center; margin-bottom:20px; }
        .filter-bar input { padding:8px 14px; border:1px solid rgba(0,255,255,.15); border-radius:6px; background:rgba(255,255,255,.05); color:#c8d6e5; font-size:14px; outline:none; transition:all .3s; min-width:220px; }
        .filter-bar input:focus { border-color:#00d2ff; box-shadow:0 0 8px rgba(0,210,255,.15); }
        .ds-table { width:100%; border-collapse:collapse; margin-bottom:20px; }
        .ds-table th, .ds-table td { padding:12px 14px; text-align:left; border-bottom:1px solid rgba(255,255,255,.05); font-size:13px; }
        .ds-table th { color:rgba(255,255,255,.4); font-weight:500; background:rgba(255,255,255,.02); }
        .ds-table td { color:#e2e8f0; }
        .ds-table tr:hover td { background:rgba(0,210,255,.03); }
        .ds-table .name-link { color:#00d2ff; cursor:pointer; text-decoration:none; }
        .ds-table .name-link:hover { color:#a855f7; }
        .type-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px; }
        .type-chart { background:rgba(0,210,255,.15); color:#00d2ff; }
        .type-earth { background:rgba(0,200,83,.15); color:#5FB878; }
        .type-wordcloud { background:rgba(168,85,247,.15); color:#a855f7; }
        .type-stat { background:rgba(255,193,7,.15); color:#ffc107; }
        .type-mixed { background:rgba(255,107,107,.15); color:#ff6b6b; }
        .pagination { display:flex; justify-content:center; gap:8px; align-items:center; padding:20px 0; color:rgba(255,255,255,.5); font-size:13px; }
        .pagination button { padding:6px 14px; border:1px solid rgba(0,255,255,.15); border-radius:6px; background:transparent; color:#c8d6e5; cursor:pointer; }
        .pagination button:hover { border-color:#00d2ff; }
        .pagination button:disabled { opacity:.3; cursor:not-allowed; }
        .pagination .page-info { padding:0 10px; }
        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.7); z-index:1000; align-items:center; justify-content:center; }
        .modal-overlay.show { display:flex; }
        .modal-box { background:#1a1f3a; border:1px solid rgba(0,255,255,.15); border-radius:16px; width:700px; max-width:90vw; max-height:85vh; overflow-y:auto; padding:30px; position:relative; }
        .modal-box h2 { font-size:20px; margin-bottom:20px; color:#e2e8f0; }
        .modal-close { position:absolute; top:15px; right:20px; cursor:pointer; font-size:24px; color:rgba(255,255,255,.3); }
        .modal-close:hover { color:#ff6b6b; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; margin-bottom:6px; font-size:13px; color:rgba(255,255,255,.6); }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 14px; border:1px solid rgba(0,255,255,.15); border-radius:8px; background:rgba(255,255,255,.05); color:#c8d6e5; font-size:14px; outline:none; transition:all .3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#00d2ff; box-shadow:0 0 8px rgba(0,210,255,.15); }
        .form-group textarea { min-height:80px; resize:vertical; font-family:'Cascadia Code','Fira Code',monospace; }
        .form-group .help-text { font-size:12px; color:rgba(255,255,255,.35); margin-top:4px; }
        .toast { position:fixed; top:20px; right:20px; padding:12px 24px; border-radius:8px; z-index:2000; display:none; font-size:14px; }
        .toast.success { background:rgba(0,200,83,.9); color:#fff; display:block; }
        .toast.error { background:rgba(255,77,77,.9); color:#fff; display:block; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>数智大屏</h1>
        <div class="actions"><button class="btn-primary" onclick="showAddModal()">+ 新建大屏</button></div>
    </div>
    <div class="content">
        <div class="filter-bar"><input type="text" id="fKeyword" placeholder="搜索大屏名称/描述..." oninput="doSearch()"></div>
        <table class="ds-table">
            <thead><tr><th>ID</th><th>名称</th><th>类型</th><th>描述</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="dsTbody"></tbody>
        </table>
        <div id="pagination" class="pagination"></div>
    </div>

    <div class="modal-overlay" id="dsModal">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal('dsModal')">&times;</span>
            <h2 id="modalTitle">新建大屏</h2>
            <input type="hidden" id="editId" value="0">
            <div class="form-group"><label>名称 <span style="color:#ff6b6b;">*</span></label><input type="text" id="fName" placeholder="如：销售数据大屏"></div>
            <div class="form-group"><label>类型 <span style="color:#ff6b6b;">*</span></label>
                <select id="fType">
                    <option value="chart">📊 图表大屏</option>
                    <option value="earth">🌍 3D地球大屏</option>
                    <option value="wordcloud">☁️ 词云大屏</option>
                    <option value="stat">📈 数据统计大屏</option>
                    <option value="mixed">🎯 混合大屏</option>
                </select>
            </div>
            <div class="form-group"><label>描述</label><textarea id="fDesc" rows="2" placeholder="描述大屏的用途..."></textarea></div>
            <div class="form-group"><label>原始数据（JSON数组）</label><textarea id="fData" rows="5" placeholder='[{"name":"北京","value":100},{"name":"上海","value":80}]'></textarea></div>
            <div class="form-group"><label>图表配置（JSON，可选）</label><textarea id="fConfig" rows="4" placeholder='{"title":"示例图表","xField":"name","yField":"value"}'></textarea></div>
            <div class="form-group"><label>布局配置（JSON，可选）</label><textarea id="fLayout" rows="3" placeholder='{"columns":2,"gap":16}'></textarea></div>
            <div style="text-align:right;margin-top:20px;">
                <button class="btn-secondary" onclick="closeModal('dsModal')" style="margin-right:10px;">取消</button>
                <button class="btn-primary" onclick="saveDatascreen()">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script>
        function escapeHtml(t){if(!t)return '';return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
        function getXsrfToken(){var c=document.cookie.split(';');for(var i=0;i<c.length;i++){var d=c[i].trim();if(d.indexOf('_xsrf=')===0)return d.substring(6);}return '';}
        var xsrf=getXsrfToken(), currentPage=1;

        function doSearch(){currentPage=1;loadList();}
        function loadList(){
            var kw=document.getElementById('fKeyword').value;
            fetch('/admin/datascreen/list?page='+currentPage+'&page_size=15&keyword='+encodeURIComponent(kw))
            .then(function(r){return r.json();}).then(function(data){
                var html='';
                if(data.items&&data.items.length){
                    data.items.forEach(function(d){
                        var tc='type-'+d.screen_type||'chart';
                        var tl={chart:'📊图表',earth:'🌍3D地球',wordcloud:'☁️词云',stat:'📈统计',mixed:'🎯混合'}[d.screen_type]||'📊图表';
                        html+='<tr><td>'+d.id+'</td>';
                        html+='<td><a class="name-link" href="/admin/datascreen/view?id='+d.id+'" target="_blank">'+escapeHtml(d.name)+'</a></td>';
                        html+='<td><span class="type-badge '+tc+'">'+tl+'</span></td>';
                        html+='<td style="color:rgba(255,255,255,.4);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.description||'')+'</td>';
                        html+='<td style="color:rgba(255,255,255,.4);font-size:12px;">'+(d.create_at||'')+'</td>';
                        html+='<td><button class="btn-secondary btn-sm" onclick="editItem('+d.id+')" style="margin-right:4px;">编辑</button><button class="btn-danger btn-sm" onclick="deleteItem('+d.id+')">删除</button></td></tr>';
                    });
                } else {
                    html='<tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,.3);">暂无大屏</td></tr>';
                }
                document.getElementById('dsTbody').innerHTML=html;
                var total=data.total||0,page=data.page||1,size=data.page_size||15,pages=Math.max(1,Math.ceil(total/size));
                var ph='<button onclick="goP('+(page-1)+')" '+(page<=1?'disabled':'')+'>上一页</button><span class="page-info">'+page+'/'+pages+'</span><button onclick="goP('+(page+1)+')" '+(page>=pages?'disabled':'')+'>下一页</button>';
                document.getElementById('pagination').innerHTML=ph;
            });
        }
        function goP(p){currentPage=p;loadList();}

        function showAddModal(){
            document.getElementById('modalTitle').textContent='新建大屏';
            document.getElementById('editId').value='0';
            document.getElementById('fName').value='';
            document.getElementById('fType').value='chart';
            document.getElementById('fDesc').value='';
            document.getElementById('fData').value='';
            document.getElementById('fConfig').value='';
            document.getElementById('fLayout').value='';
            document.getElementById('dsModal').classList.add('show');
        }
        function editItem(id){
            document.getElementById('modalTitle').textContent='编辑大屏';
            document.getElementById('editId').value=id;
            fetch('/admin/datascreen/get?id='+id).then(function(r){return r.json();}).then(function(res){
                if(res.code!==0){showToast('error',res.msg);return;}
                var d=res.data;
                document.getElementById('fName').value=d.name||'';
                document.getElementById('fType').value=d.screen_type||'chart';
                document.getElementById('fDesc').value=d.description||'';
                document.getElementById('fData').value=JSON.stringify(d.raw_data||[],null,2);
                document.getElementById('fConfig').value=JSON.stringify(d.chart_config||{},null,2);
                document.getElementById('fLayout').value=JSON.stringify(d.layout_config||{},null,2);
                document.getElementById('dsModal').classList.add('show');
            });
        }
        function saveDatascreen(){
            var id=document.getElementById('editId').value;
            var name=document.getElementById('fName').value.trim();
            var type=document.getElementById('fType').value;
            var desc=document.getElementById('fDesc').value.trim();
            var data=document.getElementById('fData').value.trim()||'[]';
            var config=document.getElementById('fConfig').value.trim()||'{}';
            var layout=document.getElementById('fLayout').value.trim()||'{}';
            if(!name){showToast('error','名称不能为空');return;}
            var url=id>0?'/admin/datascreen/edit':'/admin/datascreen/add';
            var body='name='+encodeURIComponent(name)+'&description='+encodeURIComponent(desc)+'&screen_type='+type+'&raw_data='+encodeURIComponent(data)+'&chart_config='+encodeURIComponent(config)+'&layout_config='+encodeURIComponent(layout)+'&_xsrf='+xsrf;
            if(id>0) body+='&id='+id;
            fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
            .then(function(r){return r.json();}).then(function(res){
                if(res.code===0){showToast('success',id>0?'更新成功':'新建成功');closeModal('dsModal');loadList();}
                else {showToast('error',res.msg);}
            });
        }
        function deleteItem(id){
            if(!confirm('确定删除？')) return;
            fetch('/admin/datascreen/delete',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'id='+id+'&_xsrf='+xsrf})
            .then(function(r){return r.json();}).then(function(res){if(res.code===0){showToast('success','删除成功');loadList();}else{showToast('error',res.msg);}});
        }
        function closeModal(id){document.getElementById(id).classList.remove('show');}
        function showToast(type,msg){var el=document.getElementById('toast');el.className='toast '+type;el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none';},3000);}
        loadList();
    </script>
</body>
</html>
