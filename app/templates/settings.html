<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
    <style>
        .main-container { padding: 15px; }
        .icon-grid { display: flex; flex-wrap: wrap; gap: 15px; padding: 30px; justify-content: center; }
        .icon-card { width: 220px; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border-radius: 6px; cursor: pointer; transition: all 0.3s; border: 1px solid #eee; }
        .icon-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); border-color: #1E9FFF; }
        .icon-card i { font-size: 48px; margin-bottom: 12px; }
        .icon-card p { font-size: 16px; color: #333; }
    </style>
</head>
<body style="background:#f2f2f2;">
<div class="main-container">
    <div class="layui-card">
        <div class="layui-card-header"><h3>系统设置</h3></div>
        <div class="layui-card-body">
            <div class="icon-grid">
                <a href="/admin/settings/config" target="_self" class="icon-card">
                    <i class="layui-icon layui-icon-set" style="color:#1E9FFF;"></i>
                    <p>系统配置</p>
                </a>
                <a href="/admin/settings/logs" target="_self" class="icon-card">
                    <i class="layui-icon layui-icon-file-text" style="color:#5FB878;"></i>
                    <p>日志查看</p>
                </a>
                <a href="/admin/settings/monitor" target="_self" class="icon-card">
                    <i class="layui-icon layui-icon-chart" style="color:#FFB800;"></i>
                    <p>性能监控</p>
                </a>
                <a href="/admin/settings/analysis" target="_self" class="icon-card">
                    <i class="layui-icon layui-icon-bar-chart" style="color:#FF5722;"></i>
                    <p>日志分析</p>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
