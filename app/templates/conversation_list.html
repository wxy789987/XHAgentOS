<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0e1a; color: #c8d6e5; min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0e1a; }
        ::-webkit-scrollbar-thumb { background: #2d3a6e; border-radius: 3px; }

        .page-header {
            padding: 24px 30px 10px 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0, 255, 255, .1);
        }
        .page-header h1 {
            font-size: 24px; font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header .actions { display: flex; gap: 12px; align-items: center; }

        .btn-primary, .btn-secondary, .btn-danger, .btn-sm {
            padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all .3s;
        }
        .btn-primary { background: linear-gradient(135deg, #00d2ff, #3b82f6); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,210,255,.3); }
        .btn-secondary { border: 1px solid rgba(0,255,255,.2); background: transparent; color: #00d2ff; }
        .btn-secondary:hover { background: rgba(0,255,255,.05); border-color: #00d2ff; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        .content { padding: 20px 30px; }
        .filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select {
            padding: 8px 14px; border: 1px solid rgba(0,255,255,.15); border-radius: 6px;
            background: rgba(255,255,255,.05); color: #c8d6e5; font-size: 14px; outline: none;
            transition: all .3s; min-width: 160px;
        }
        .filter-bar input:focus, .filter-bar select:focus { border-color: #00d2ff; box-shadow: 0 0 8px rgba(0,210,255,.15); }

        .conv-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .conv-table th, .conv-table td {
            padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px;
        }
        .conv-table th { color: rgba(255,255,255,.4); font-weight: 500; background: rgba(255,255,255,.02); }
        .conv-table td { color: #e2e8f0; }
        .conv-table tr:hover td { background: rgba(0,210,255,.03); }
        .conv-table .title-link { color: #00d2ff; cursor: pointer; text-decoration: none; }
        .conv-table .title-link:hover { color: #a855f7; }

        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; }
        .status-active { background: rgba(0,200,83,.15); color: #5FB878; }
        .status-closed { background: rgba(255,255,255,.1); color: rgba(255,255,255,.4); }

        .pagination { display: flex; justify-content: center; gap: 8px; align-items: center; padding: 20px 0; color: rgba(255,255,255,.5); font-size: 13px; }
        .pagination button { padding: 6px 14px; border: 1px solid rgba(0,255,255,.15); border-radius: 6px; background: transparent; color: #c8d6e5; cursor: pointer; }
        .pagination button:hover { border-color: #00d2ff; }
        .pagination button:disabled { opacity: .3; cursor: not-allowed; }
        .pagination .page-info { padding: 0 10px; }

        .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,.7); z-index:1000; align-items:center; justify-content:center; }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #1a1f3a; border: 1px solid rgba(0,255,255,.15); border-radius: 16px;
            width: 520px; max-width: 90vw; padding: 30px; position: relative;
        }
        .modal-box h2 { font-size: 20px; margin-bottom: 20px; color: #e2e8f0; }
        .modal-close { position: absolute; top:15px; right:20px; cursor: pointer; font-size:24px; color:rgba(255,255,255,.3); }
        .modal-close:hover { color:#ff6b6b; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,.6); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border: 1px solid rgba(0,255,255,.15); border-radius: 8px;
            background: rgba(255,255,255,.05); color: #c8d6e5; font-size: 14px; outline: none; transition: all .3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #00d2ff; box-shadow: 0 0 8px rgba(0,210,255,.15); }
        .form-group textarea { min-height: 60px; resize: vertical; }

        .toast { position: fixed; top:20px; right:20px; padding:12px 24px; border-radius:8px; z-index:2000; display:none; font-size:14px; }
        .toast.success { background: rgba(0,200,83,.9); color:#fff; display:block; }
        .toast.error { background: rgba(255,77,77,.9); color:#fff; display:block; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
        .badge-violation { background: rgba(255,77,77,.15); color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>会话管理</h1>
        <div class="actions">
            <button class="btn-secondary btn-sm" onclick="monitorViolations()">违规监控</button>
            <button class="btn-primary" onclick="showAddModal()">+ 新增会话</button>
        </div>
    </div>
    <div class="content">
        <div class="filter-bar">
            <input type="text" id="fKeyword" placeholder="搜索会话名称..." oninput="doSearch()">
            <select id="fStatus" onchange="doSearch()">
                <option value="">全部状态</option>
                <option value="active">进行中</option>
                <option value="closed">已关闭</option>
            </select>
        </div>
        <table class="conv-table">
            <thead>
                <tr><th>ID</th><th>会话名称</th><th>消息数</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="convTbody"></tbody>
        </table>
        <div id="pagination" class="pagination"></div>
    </div>

    <div class="modal-overlay" id="convModal">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal('convModal')">&times;</span>
            <h2 id="modalTitle">新增会话</h2>
            <input type="hidden" id="editId" value="0">
            <div class="form-group"><label>会话名称 <span style="color:#ff6b6b;">*</span></label><input type="text" id="fTitle" placeholder="如：用户反馈会话"></div>
            <div class="form-group"><label>描述</label><textarea id="fDesc" placeholder="会话描述..."></textarea></div>
            <div class="form-group" id="statusGroup" style="display:none;"><label>状态</label><select id="fStatusSel"><option value="active">进行中</option><option value="closed">已关闭</option></select></div>
            <div style="text-align:right;margin-top:20px;">
                <button class="btn-secondary" onclick="closeModal('convModal')" style="margin-right:10px;">取消</button>
                <button class="btn-primary" onclick="saveConv()">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script>
        function getXsrfToken() { var c=document.cookie.split(';'); for(var i=0;i<c.length;i++){var d=c[i].trim();if(d.indexOf('_xsrf=')===0)return d.substring(6);}return ''; }
        var xsrf = getXsrfToken(), currentPage = 1;

        function doSearch(){ currentPage=1; loadConvs(); }
        function loadConvs(){
            var kw = document.getElementById('fKeyword').value;
            var st = document.getElementById('fStatus').value;
            fetch('/admin/conversation/list?page='+currentPage+'&page_size=15&keyword='+encodeURIComponent(kw)+'&status='+st)
            .then(function(r){return r.json();})
            .then(function(data){
                var html = '';
                if(data.items && data.items.length>0){
                    data.items.forEach(function(c){
                        var statusCls = c.status==='active'?'status-active':'status-closed';
                        var statusLabel = c.status==='active'?'进行中':'已关闭';
                        var violationBadge = c.violation_count > 0 ? ' <span class="badge badge-violation">违规</span>' : '';
                        html += '<tr><td>'+c.id+'</td>';
                        html += '<td><a class="title-link" href="/admin/conversation/detail?id='+c.id+'" target="_blank">'+escapeHtml(c.title)+'</a>'+violationBadge+'</td>';
                        html += '<td>'+(c.message_count||0)+'</td>';
                        html += '<td><span class="status-badge '+statusCls+'">'+statusLabel+'</span></td>';
                        html += '<td style="color:rgba(255,255,255,.4);font-size:12px;">'+(c.create_at||'')+'</td>';
                        html += '<td>';
                        html += '<button class="btn-secondary btn-sm" onclick="editConv('+c.id+')" style="margin-right:4px;">编辑</button>';
                        html += '<button class="btn-danger btn-sm" onclick="deleteConv('+c.id+')">删除</button>';
                        html += '</td></tr>';
                    });
                } else {
                    html = '<tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,.3);">暂无会话数据</td></tr>';
                }
                document.getElementById('convTbody').innerHTML = html;
                renderPagination(data);
            });
        }

        function escapeHtml(t){ if(!t) return ''; return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function renderPagination(data){
            var total=data.total||0, page=data.page||1, size=data.page_size||15, pages=Math.max(1,Math.ceil(total/size));
            var html = '<button onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>上一页</button>';
            html += '<span class="page-info">'+page+' / '+pages+'</span>';
            html += '<button onclick="goPage('+(page+1)+')" '+(page>=pages?'disabled':'')+'>下一页</button>';
            document.getElementById('pagination').innerHTML = html;
        }
        function goPage(p){ currentPage=p; loadConvs(); }

        function showAddModal(){
            document.getElementById('modalTitle').textContent = '新增会话';
            document.getElementById('editId').value = '0';
            document.getElementById('fTitle').value = '';
            document.getElementById('fDesc').value = '';
            document.getElementById('statusGroup').style.display = 'none';
            document.getElementById('convModal').classList.add('show');
        }

        function editConv(id){
            document.getElementById('modalTitle').textContent = '编辑会话';
            document.getElementById('editId').value = id;
            document.getElementById('statusGroup').style.display = 'block';
            fetch('/admin/conversation/get?id='+id)
            .then(function(r){return r.json();})
            .then(function(res){
                if(res.code!==0){showToast('error',res.msg);return;}
                var c=res.data;
                document.getElementById('fTitle').value=c.title||'';
                document.getElementById('fDesc').value=c.description||'';
                document.getElementById('fStatusSel').value=c.status||'active';
                document.getElementById('convModal').classList.add('show');
            });
        }

        function saveConv(){
            var id=document.getElementById('editId').value;
            var title=document.getElementById('fTitle').value.trim();
            var desc=document.getElementById('fDesc').value.trim();
            var status=document.getElementById('fStatusSel')?document.getElementById('fStatusSel').value:'active';
            if(!title){showToast('error','会话名称不能为空');return;}
            var url=id>0?'/admin/conversation/edit':'/admin/conversation/add';
            var body='title='+encodeURIComponent(title)+'&description='+encodeURIComponent(desc)+'&_xsrf='+xsrf;
            if(id>0) body+='&id='+id+'&status='+status;
            fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
            .then(function(r){return r.json();})
            .then(function(res){
                if(res.code===0){showToast('success',id>0?'更新成功':'新增成功');closeModal('convModal');loadConvs();}
                else {showToast('error',res.msg);}
            });
        }

        function deleteConv(id){
            if(!confirm('确定删除该会话吗？')) return;
            fetch('/admin/conversation/delete',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'id='+id+'&_xsrf='+xsrf})
            .then(function(r){return r.json();})
            .then(function(res){if(res.code===0){showToast('success','删除成功');loadConvs();}else{showToast('error',res.msg);}});
        }

        function monitorViolations(){ window.location.href = '/admin/conversation/violation/monitor'; }

        function closeModal(id){ document.getElementById(id).classList.remove('show'); }
        function showToast(type,msg){
            var el=document.getElementById('toast');
            el.className='toast '+type; el.textContent=msg; el.style.display='block';
            setTimeout(function(){el.style.display='none';},3000);
        }
        loadConvs();
    </script>
</body>
</html>
