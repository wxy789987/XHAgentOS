<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
    <style>
        .stat-card { text-align:center; padding:15px 0; }
        .stat-number { font-size:36px; font-weight:bold; margin-bottom:5px; }
        .stat-label { color:#888; font-size:13px; }
        .chart-box { width:100%; height:320px; }
    </style>
</head>
<body style="background:#f2f2f2;">
<div class="main-container">
    <div class="layui-card">
        <div class="layui-card-header"><h3>日志分析</h3></div>
        <div class="layui-card-body">
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md3">
                    <div class="layui-card"><div class="layui-card-body">
                        <div class="stat-card"><div class="stat-number" style="color:#1E9FFF;">{{ analysis["total_requests"] }}</div><div class="stat-label">总请求数</div></div>
                    </div></div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-card"><div class="layui-card-body">
                        <div class="stat-card"><div class="stat-number" style="color:#5FB878;">{{ analysis["today_requests"] }}</div><div class="stat-label">今日请求</div></div>
                    </div></div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-card"><div class="layui-card-body">
                        <div class="stat-card"><div class="stat-number" style="color:#FFB800;">{{ analysis["avg_response_time"] }}ms</div><div class="stat-label">平均响应时间</div></div>
                    </div></div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-card"><div class="layui-card-body">
                        <div class="stat-card"><div class="stat-number" style="color:#FF5722;">{{ analysis["error_rate"] }}%</div><div class="stat-label">错误率</div></div>
                    </div></div>
                </div>
            </div>
            <div class="layui-row layui-col-space15" style="margin-top:15px;">
                <div class="layui-col-md6">
                    <div class="layui-card">
                        <div class="layui-card-header">时段请求分布</div>
                        <div class="layui-card-body"><div id="chartHourly" class="chart-box"></div></div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-card">
                        <div class="layui-card-header">响应时间分布</div>
                        <div class="layui-card-body"><div id="chartResponse" class="chart-box"></div></div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-card">
                        <div class="layui-card-header">热门接口 TOP5</div>
                        <div class="layui-card-body"><div id="chartEndpoints" class="chart-box"></div></div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-card">
                        <div class="layui-card-header">错误类型分布</div>
                        <div class="layui-card-body"><div id="chartErrors" class="chart-box"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ static_url('dist/echarts/echarts.min.js') }}"></script>
<script id="analysis-data" type="application/json">{% raw analysis_json %}</script>
<script>
var analysisData = JSON.parse(document.getElementById('analysis-data').textContent);
var hourlyData = analysisData.hourly_requests;
var responseData = analysisData.response_time_dist;
var endpointData = analysisData.top_endpoints;
var errorData = analysisData.error_types;

// 时段请求折线图
(function(){
    var c = echarts.init(document.getElementById('chartHourly'));
    c.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'category', data: hourlyData.map(function(d){ return d.hour; }), axisLabel: { color: '#888' } },
        yAxis: { type: 'value', axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: '#eee' } } },
        series: [{
            type: 'line', smooth: true,
            data: hourlyData.map(function(d){ return d.count; }),
            itemStyle: { color: '#1E9FFF' },
            areaStyle: { color: 'rgba(30,159,255,0.15)' }
        }]
    });
    window.addEventListener('resize', function(){ c.resize(); });
})();

// 响应时间柱状图
(function(){
    var c = echarts.init(document.getElementById('chartResponse'));
    c.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'category', data: responseData.map(function(d){ return d.range; }), axisLabel: { color: '#888' } },
        yAxis: { type: 'value', axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: '#eee' } } },
        series: [{
            type: 'bar',
            data: responseData.map(function(d){ return d.count; }),
            itemStyle: {
                color: function(p){
                    var colors = ['#5FB878','#1E9FFF','#FFB800','#FF5722'];
                    return colors[p.dataIndex] || '#5FB878';
                }
            },
            barWidth: '50%'
        }]
    });
    window.addEventListener('resize', function(){ c.resize(); });
})();

// 热门接口横向柱状图
(function(){
    var names = endpointData.map(function(d){ return d.endpoint.replace('/admin/', ''); }).reverse();
    var values = endpointData.map(function(d){ return d.count; }).reverse();
    var c = echarts.init(document.getElementById('chartEndpoints'));
    c.setOption({
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'value', axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: '#eee' } } },
        yAxis: { type: 'category', data: names, axisLabel: { color: '#333', fontSize: 11 } },
        series: [{
            type: 'bar',
            data: values,
            itemStyle: { color: '#5FB878' },
            barWidth: '55%'
        }]
    });
    window.addEventListener('resize', function(){ c.resize(); });
})();

// 错误类型饼图
(function(){
    var c = echarts.init(document.getElementById('chartErrors'));
    c.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        series: [{
            type: 'pie', radius: ['40%','70%'],
            center: ['50%','55%'],
            label: { color: '#555', fontSize: 12 },
            data: errorData.map(function(d){ return { name: d.type, value: d.count }; }),
            itemStyle: {
                color: function(p){
                    var colors = ['#FF5722','#FF6B35','#FFB800','#1E9FFF'];
                    return colors[p.dataIndex] || '#999';
                }
            },
            emphasis: {
                label: { fontSize: 14, fontWeight: 'bold' },
                itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' }
            }
        }]
    });
    window.addEventListener('resize', function(){ c.resize(); });
})();
</script>
</body>
</html>
