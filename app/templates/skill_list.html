<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0e1a;
            color: #c8d6e5;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0e1a; }
        ::-webkit-scrollbar-thumb { background: #2d3a6e; border-radius: 3px; }

        .page-header {
            padding: 24px 30px 10px 30px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0, 255, 255, .1);
        }
        .page-header h1 {
            font-size: 24px; font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header .actions { display: flex; gap: 12px; align-items: center; }

        .btn-primary {
            padding: 8px 20px; border: none; border-radius: 6px;
            background: linear-gradient(135deg, #00d2ff, #3b82f6);
            color: #fff; cursor: pointer; font-size: 14px;
            transition: all .3s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0, 210, 255, .3); }
        .btn-secondary {
            padding: 8px 20px; border: 1px solid rgba(0, 255, 255, .2); border-radius: 6px;
            background: transparent; color: #00d2ff; cursor: pointer; font-size: 14px;
            transition: all .3s;
        }
        .btn-secondary:hover { background: rgba(0, 255, 255, .05); border-color: #00d2ff; }
        .btn-danger {
            padding: 6px 14px; border: none; border-radius: 6px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff; cursor: pointer; font-size: 12px; transition: all .3s;
        }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        .content { padding: 20px 30px; }

        .filter-bar {
            display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            padding: 8px 14px; border: 1px solid rgba(0, 255, 255, .15); border-radius: 6px;
            background: rgba(255,255,255,.05); color: #c8d6e5; font-size: 14px; outline: none;
            transition: all .3s; min-width: 160px;
        }
        .filter-bar input:focus, .filter-bar select:focus { border-color: #00d2ff; box-shadow: 0 0 8px rgba(0,210,255,.15); }

        .skill-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 18px; margin-bottom: 20px;
        }
        .skill-card {
            background: linear-gradient(135deg, rgba(15,23,58,.8), rgba(30,27,75,.8));
            border: 1px solid rgba(0, 255, 255, .1); border-radius: 12px;
            padding: 20px; transition: all .3s; position: relative;
        }
        .skill-card:hover { border-color: rgba(0, 210, 255, .3); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,.3); }
        .skill-card .badge {
            display: inline-block; padding: 2px 10px; border-radius: 10px;
            font-size: 11px; font-weight: 600; margin-bottom: 8px;
        }
        .badge-api { background: rgba(0,210,255,.15); color: #00d2ff; }
        .badge-ai { background: rgba(168,85,247,.15); color: #a855f7; }
        .skill-card .cat-tag {
            position: absolute; top: 12px; right: 12px;
            padding: 2px 10px; border-radius: 10px;
            background: rgba(255,255,255,.05); color: rgba(255,255,255,.4); font-size: 11px;
        }
        .skill-card h3 { font-size: 16px; color: #e2e8f0; margin-bottom: 6px; }
        .skill-card .desc {
            font-size: 13px; color: rgba(255,255,255,.5);
            line-height: 1.6; margin-bottom: 12px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .skill-card .meta {
            display: flex; gap: 16px; font-size: 12px; color: rgba(255,255,255,.35);
            padding-top: 12px; border-top: 1px solid rgba(255,255,255,.05);
        }
        .skill-card .actions {
            display: flex; gap: 8px; margin-top: 12px;
        }

        .pagination {
            display: flex; justify-content: center; gap: 8px; align-items: center;
            padding: 20px 0; color: rgba(255,255,255,.5); font-size: 13px;
        }
        .pagination button {
            padding: 6px 14px; border: 1px solid rgba(0,255,255,.15); border-radius: 6px;
            background: transparent; color: #c8d6e5; cursor: pointer;
        }
        .pagination button:hover { border-color: #00d2ff; }
        .pagination button:disabled { opacity: .3; cursor: not-allowed; }
        .pagination .page-info { padding: 0 10px; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.7); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #1a1f3a; border: 1px solid rgba(0,255,255,.15); border-radius: 16px;
            width: 600px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
            padding: 30px; position: relative;
        }
        .modal-box h2 { font-size: 20px; margin-bottom: 20px; color: #e2e8f0; }
        .modal-close {
            position: absolute; top: 15px; right: 20px; cursor: pointer;
            font-size: 24px; color: rgba(255,255,255,.3); transition: color .3s;
        }
        .modal-close:hover { color: #ff6b6b; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,.6); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border: 1px solid rgba(0,255,255,.15); border-radius: 8px;
            background: rgba(255,255,255,.05); color: #c8d6e5; font-size: 14px; outline: none;
            transition: all .3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #00d2ff; box-shadow: 0 0 8px rgba(0,210,255,.15);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }

        /* Call result modal */
        .call-result { background: rgba(0,0,0,.3); border-radius: 8px; padding: 15px; margin-top: 10px; max-height: 300px; overflow: auto; }
        .call-result pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: #00d2ff; }

        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; font-size: 14px; }
        .toast.success { background: rgba(0,200,83,.9); color: #fff; display: block; }
        .toast.error { background: rgba(255,77,77,.9); color: #fff; display: block; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>技能管理</h1>
        <div class="actions">
            <button class="btn-secondary" onclick="showAICreateModal()">AI创建技能</button>
            <button class="btn-primary" onclick="showAddModal()">+ 新增技能</button>
        </div>
    </div>
    <div class="content">
        <div class="filter-bar">
            <input type="text" id="fKeyword" placeholder="搜索技能名称/描述..." oninput="doSearch()">
            <select id="fType" onchange="doSearch()">
                <option value="">全部类型</option>
                <option value="api">API技能</option>
                <option value="ai">AI技能</option>
            </select>
            <input type="text" id="fCategory" placeholder="分类筛选..." oninput="doSearch()">
        </div>
        <div id="skillList" class="skill-grid"></div>
        <div id="pagination" class="pagination"></div>
    </div>

    <!-- 新增/编辑技能弹窗 -->
    <div class="modal-overlay" id="skillModal">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal('skillModal')">&times;</span>
            <h2 id="modalTitle">新增技能</h2>
            <input type="hidden" id="editId" value="0">
            <div class="form-group">
                <label>技能名称 <span style="color:#ff6b6b;">*</span></label>
                <input type="text" id="fName" placeholder="如：查询天气">
            </div>
            <div class="form-group">
                <label>技能描述</label>
                <textarea id="fDesc" placeholder="描述技能的功能和适用场景"></textarea>
            </div>
            <div class="form-group">
                <label>技能类型</label>
                <select id="fTypeSel">
                    <option value="api">API技能（调用外部接口）</option>
                    <option value="ai">AI技能（调用AI模型）</option>
                </select>
            </div>
            <div class="form-group">
                <label>分类</label>
                <input type="text" id="fCategorySel" placeholder="如：信息查询、数据处理">
            </div>
            <div class="form-group">
                <label>配置（JSON格式）</label>
                <textarea id="fConfig" rows="5" placeholder='请根据技能类型填写配置...'></textarea>
                <div style="margin-top:6px;font-size:12px;color:rgba(255,255,255,.4);" id="configHint">
                    <span id="configHintText">API类型示例：{"url":"https://api.example.com/weather?city={city}","method":"GET"}</span>
                </div>
            </div>
            <div class="form-group">
                <label>参数定义（JSON数组）</label>
                <textarea id="fParams" rows="3" placeholder='[{"name":"city","type":"string","required":true,"description":"城市名称"}]'></textarea>
            </div>
            <div style="text-align:right;margin-top:20px;">
                <button class="btn-secondary" onclick="closeModal('skillModal')" style="margin-right:10px;">取消</button>
                <button class="btn-primary" onclick="saveSkill()">保存</button>
            </div>
        </div>
    </div>

    <!-- AI创建弹窗 -->
    <div class="modal-overlay" id="aiCreateModal">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal('aiCreateModal')">&times;</span>
            <h2>AI创建技能</h2>
            <p style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:16px;">描述你想要的技能，AI将自动生成配置</p>
            <div class="form-group">
                <label>技能描述 <span style="color:#ff6b6b;">*</span></label>
                <textarea id="aiDesc" rows="4" placeholder="例如：创建一个可以查询任意城市天气的技能，调用天气API接口获取实时天气数据"></textarea>
            </div>
            <div id="aiResult" style="display:none;" class="call-result"></div>
            <div style="text-align:right;margin-top:20px;">
                <button class="btn-secondary" onclick="closeModal('aiCreateModal')" style="margin-right:10px;">取消</button>
                <button class="btn-primary" id="aiCreateBtn" onclick="aiCreateSkill()">开始生成</button>
            </div>
        </div>
    </div>

    <!-- 调用技能弹窗 -->
    <div class="modal-overlay" id="callModal">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal('callModal')">&times;</span>
            <h2 id="callTitle">调用技能</h2>
            <input type="hidden" id="callSkillId" value="0">
            <div id="callInputs"></div>
            <div id="callResult" style="display:none;" class="call-result"></div>
            <div style="text-align:right;margin-top:20px;">
                <button class="btn-secondary" onclick="closeModal('callModal')" style="margin-right:10px;">关闭</button>
                <button class="btn-primary" id="callBtn" onclick="executeCall()">执行调用</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="{{ static_url('dist/layui/layui.js') }}"></script>
    <script>
        function getXsrfToken() {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var c = cookies[i].trim();
                if (c.indexOf('_xsrf=') === 0) return c.substring(6);
            }
            return '';
        }
        var xsrf = getXsrfToken();

        var currentPage = 1;
        function doSearch(){ currentPage = 1; loadSkills(); }
        function loadSkills(){
            var kw = document.getElementById('fKeyword').value;
            var tp = document.getElementById('fType').value;
            var cat = document.getElementById('fCategory').value;
            fetch('/admin/skill/list?page=' + currentPage + '&page_size=12&keyword=' + encodeURIComponent(kw) + '&skill_type=' + tp + '&category=' + encodeURIComponent(cat))
                .then(function(r){ return r.json(); })
                .then(function(data){
                    var html = '';
                    if(data.items && data.items.length > 0){
                        data.items.forEach(function(s){
                            var typeLabel = s.skill_type === 'api' ? 'API' : 'AI';
                            var typeClass = s.skill_type === 'api' ? 'badge-api' : 'badge-ai';
                            var desc = s.description || '暂无描述';
                            var catLabel = s.category ? '<span class="cat-tag">' + s.category + '</span>' : '';
                            html += '<div class="skill-card">' + catLabel;
                            html += '<span class="badge ' + typeClass + '">' + typeLabel + '</span>';
                            html += '<h3>' + escapeHtml(s.name) + '</h3>';
                            html += '<div class="desc">' + escapeHtml(desc) + '</div>';
                            html += '<div class="meta"><span>参数: ' + countParams(s.parameters) + '</span><span>' + s.create_at + '</span></div>';
                            html += '<div class="actions">';
                            html += '<button class="btn-primary btn-sm" onclick="callSkill(' + s.id + ')">调用</button>';
                            html += '<button class="btn-secondary btn-sm" onclick="viewSkill(' + s.id + ')">详情</button>';
                            html += '<button class="btn-danger btn-sm" onclick="deleteSkill(' + s.id + ')">删除</button>';
                            html += '</div></div>';
                        });
                    } else {
                        html = '<div style="text-align:center;padding:60px 0;color:rgba(255,255,255,.3);">暂无技能数据，点击右上角"新增技能"或"AI创建技能"开始</div>';
                    }
                    document.getElementById('skillList').innerHTML = html;
                    renderPagination(data);
                });
        }

        function countParams(p){
            if(!p) return '0';
            try { var a = typeof p === 'string' ? JSON.parse(p) : p; return a.length; } catch(e){ return '0'; }
        }

        function escapeHtml(t){
            if(!t) return '';
            return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function renderPagination(data){
            var total = data.total || 0;
            var page = data.page || 1;
            var size = data.page_size || 12;
            var pages = Math.max(1, Math.ceil(total / size));
            var html = '';
            html += '<button onclick="goPage(' + (page-1) + ')" ' + (page<=1?'disabled':'') + '>上一页</button>';
            html += '<span class="page-info">' + page + ' / ' + pages + '</span>';
            html += '<button onclick="goPage(' + (page+1) + ')" ' + (page>=pages?'disabled':'') + '>下一页</button>';
            document.getElementById('pagination').innerHTML = html;
        }
        function goPage(p){ currentPage = p; loadSkills(); }

        // 新增技能弹窗
        function showAddModal(){
            document.getElementById('modalTitle').textContent = '新增技能';
            document.getElementById('editId').value = '0';
            document.getElementById('fName').value = '';
            document.getElementById('fDesc').value = '';
            document.getElementById('fTypeSel').value = 'api';
            document.getElementById('fCategorySel').value = '';
            document.getElementById('fConfig').value = '';
            document.getElementById('fParams').value = '';
            updateConfigHint();
            document.getElementById('skillModal').classList.add('show');
        }

        function updateConfigHint(){
            var type = document.getElementById('fTypeSel').value;
            var hint = document.getElementById('configHintText');
            if(type === 'api'){
                hint.textContent = 'API类型示例：{"url":"https://api.example.com/weather?city={city}","method":"GET"}';
            } else {
                hint.textContent = 'AI类型示例：{"prompt_template":"请帮我分析以下内容：{text}"}';
            }
        }
        // 监听类型切换
        document.getElementById('fTypeSel').addEventListener('change', updateConfigHint);

        function saveSkill(){
            var id = document.getElementById('editId').value;
            var name = document.getElementById('fName').value.trim();
            var desc = document.getElementById('fDesc').value.trim();
            var type = document.getElementById('fTypeSel').value;
            var cat = document.getElementById('fCategorySel').value.trim();
            var config = document.getElementById('fConfig').value.trim() || '{}';
            var params = document.getElementById('fParams').value.trim() || '[]';

            if(!name){ showToast('error', '技能名称不能为空'); return; }

            var url = id > 0 ? '/admin/skill/edit' : '/admin/skill/add';
            var body = 'name=' + encodeURIComponent(name) +
                       '&description=' + encodeURIComponent(desc) +
                       '&skill_type=' + type +
                       '&category=' + encodeURIComponent(cat) +
                       '&config=' + encodeURIComponent(config) +
                       '&parameters=' + encodeURIComponent(params) +
                       '&_xsrf=' + xsrf;
            if(id > 0) body += '&id=' + id;

            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: body
            })
            .then(function(r){ return r.json(); })
            .then(function(res){
                if(res.code === 0){
                    showToast('success', id > 0 ? '更新成功' : '新增成功');
                    closeModal('skillModal');
                    loadSkills();
                } else {
                    showToast('error', res.msg);
                }
            })
            .catch(function(err){ showToast('error', '请求失败: ' + err.message); });
        }

        // 删除技能
        function deleteSkill(id){
            if(!confirm('确定删除该技能吗？')) return;
            fetch('/admin/skill/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'id=' + id + '&_xsrf=' + xsrf
            })
            .then(function(r){ return r.json(); })
            .then(function(res){
                if(res.code === 0){ showToast('success', '删除成功'); loadSkills(); }
                else { showToast('error', res.msg); }
            })
            .catch(function(err){ showToast('error', '删除失败: ' + err.message); });
        }

        // 查看详情
        function viewSkill(id){
            window.open('/admin/skill/detail?id=' + id, '_blank');
        }

        // AI创建技能
        function showAICreateModal(){
            document.getElementById('aiDesc').value = '';
            document.getElementById('aiResult').style.display = 'none';
            document.getElementById('aiCreateBtn').disabled = false;
            document.getElementById('aiCreateBtn').textContent = '开始生成';
            document.getElementById('aiCreateModal').classList.add('show');
        }

        function aiCreateSkill(){
            var desc = document.getElementById('aiDesc').value.trim();
            if(!desc){ showToast('error', '请输入技能描述'); return; }
            var btn = document.getElementById('aiCreateBtn');
            btn.disabled = true;
            btn.textContent = '生成中...';
            document.getElementById('aiResult').style.display = 'none';

            fetch('/admin/skill/ai_create', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'description=' + encodeURIComponent(desc) + '&_xsrf=' + xsrf
            })
            .then(function(r){ return r.json(); })
            .then(function(res){
                btn.disabled = false;
                btn.textContent = '开始生成';
                if(res.code === 0){
                    var html = '<div style="color:#5FB878;margin-bottom:10px;">创建成功！</div>';
                    html += '<div><strong>' + escapeHtml(res.skill.name) + '</strong> (' + res.skill.skill_type + ')</div>';
                    html += '<div style="color:rgba(255,255,255,.5);font-size:12px;margin:6px 0;">' + escapeHtml(res.skill.description) + '</div>';
                    html += '<div style="margin-top:10px;"><button class="btn-primary btn-sm" onclick="closeModal(\'aiCreateModal\');loadSkills();">查看列表</button></div>';
                    document.getElementById('aiResult').innerHTML = html;
                    document.getElementById('aiResult').style.display = 'block';
                } else {
                    document.getElementById('aiResult').innerHTML = '<div style="color:#ff6b6b;">创建失败: ' + escapeHtml(res.msg) + '</div>';
                    document.getElementById('aiResult').style.display = 'block';
                }
            })
            .catch(function(err){
                btn.disabled = false;
                btn.textContent = '开始生成';
                document.getElementById('aiResult').innerHTML = '<div style="color:#ff6b6b;">请求失败: ' + escapeHtml(err.message) + '</div>';
                document.getElementById('aiResult').style.display = 'block';
            });
        }

        // 调用技能
        function callSkill(id){
            document.getElementById('callSkillId').value = id;
            document.getElementById('callTitle').textContent = '调用技能';
            document.getElementById('callResult').style.display = 'none';
            document.getElementById('callBtn').disabled = false;
            document.getElementById('callBtn').textContent = '执行调用';

            // 获取技能详情用于显示参数输入
            fetch('/admin/skill/get?id=' + id)
                .then(function(r){ return r.json(); })
                .then(function(res){
                    if(res.code !== 0){ showToast('error', res.msg); return; }
                    var skill = res.data;
                    document.getElementById('callTitle').textContent = '调用技能: ' + escapeHtml(skill.name);
                    var params = [];
                    try { params = typeof skill.parameters === 'string' ? JSON.parse(skill.parameters) : (skill.parameters || []); } catch(e){}
                    var html = '';
                    if(params.length > 0){
                        params.forEach(function(p){
                            var required = p.required ? ' <span style="color:#ff6b6b;">*</span>' : '';
                            html += '<div class="form-group"><label>' + escapeHtml(p.name || p.description || p.name) + required + '</label>';
                            html += '<input type="text" class="call-input" data-name="' + escapeHtml(p.name) + '" placeholder="' + escapeHtml(p.description || '') + '"></div>';
                        });
                    } else {
                        html += '<div class="form-group"><label>输入数据</label>';
                        html += '<textarea class="call-input" id="callTextInput" rows="4" placeholder="输入要处理的数据..."></textarea></div>';
                    }
                    document.getElementById('callInputs').innerHTML = html;
                    document.getElementById('callModal').classList.add('show');
                })
                .catch(function(err){ showToast('error', '获取技能失败: ' + err.message); });
        }

        function executeCall(){
            var skillId = document.getElementById('callSkillId').value;
            var inputs = document.querySelectorAll('.call-input');
            var inputData = {};
            inputs.forEach(function(el){
                var name = el.getAttribute('data-name') || 'text';
                inputData[name] = el.value;
            });

            document.getElementById('callBtn').disabled = true;
            document.getElementById('callBtn').textContent = '执行中...';
            document.getElementById('callResult').style.display = 'none';

            fetch('/admin/skill/call', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'skill_id=' + skillId + '&input_data=' + encodeURIComponent(JSON.stringify(inputData)) + '&_xsrf=' + xsrf
            })
            .then(function(r){ return r.json(); })
            .then(function(res){
                document.getElementById('callBtn').disabled = false;
                document.getElementById('callBtn').textContent = '执行调用';
                var html = '';
                if(res.code === 0){
                    html += '<div style="color:#5FB878;margin-bottom:8px;">调用成功</div>';
                    html += '<pre>' + escapeHtml(JSON.stringify(res.data, null, 2)) + '</pre>';
                } else {
                    html += '<div style="color:#ff6b6b;margin-bottom:8px;">调用失败: ' + escapeHtml(res.msg) + '</div>';
                }
                document.getElementById('callResult').innerHTML = html;
                document.getElementById('callResult').style.display = 'block';
            })
            .catch(function(err){
                document.getElementById('callBtn').disabled = false;
                document.getElementById('callBtn').textContent = '执行调用';
                document.getElementById('callResult').innerHTML = '<div style="color:#ff6b6b;">执行失败: ' + escapeHtml(err.message) + '</div>';
                document.getElementById('callResult').style.display = 'block';
            });
        }

        function showToast(type, msg){
            var el = document.getElementById('toast');
            el.className = 'toast ' + type;
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(function(){ el.style.display = 'none'; }, 3000);
        }

        function showModal(id){ document.getElementById(id).classList.add('show'); }
        function closeModal(id){ document.getElementById(id).classList.remove('show'); }

        loadSkills();
    </script>
</body>
</html>
