<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        .search-box { padding: 15px 15px 0; background: #fff; margin-bottom: 0; }
        .search-box .layui-inline { margin-bottom: 10px; }
        .search-box .layui-btn { margin-right: 6px; }
        .toolbar-box { padding: 10px 15px; background: #fff; border-bottom: 1px solid #e6e6e6; }
        .main-container { padding: 15px; }
        .layui-table-page { text-align: center; }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 工具栏 -->
        <div class="toolbar-box" style="margin-bottom:15px;padding:10px 0;">
            <button class="layui-btn layui-btn-sm" id="btnAdd">
                <i class="layui-icon layui-icon-add-1"></i> 新增用户
            </button>
        </div>

        <!-- 数据表格 -->
        <table id="userTable" lay-filter="userTable"></table>
    </div>

    <script src="{{ static_url('dist/layui/layui.js') }}"></script>
    <script>
        // 获取 XSRF token
        function getXsrfToken() {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var c = cookies[i].trim();
                if (c.indexOf('_xsrf=') === 0) {
                    return c.substring(6);
                }
            }
            return '';
        }

        layui.use(['table', 'layer', 'form'], function(){
            var table = layui.table;
            var layer = layui.layer;
            var form = layui.form;

            // 渲染表格
            table.render({
                elem: '#userTable',
                url: '/admin/user/list',
                page: {
                    limit: 28,
                    limits: [28, 50, 100]
                },
                cols: [[
                    {type: 'numbers', title: '序号', width: 80, align: 'center'},
                    {field: 'id', title: 'ID', width: 80, align: 'center', sort: true},
                    {field: 'username', title: '用户名', width: 200, align: 'center'},
                    {field: 'create_at', title: '创建时间', width: 250, align: 'center', sort: true},
                    {title: '操作', width: 200, align: 'center', toolbar: '#toolbar'}
                ]],
                response: {
                    statusCode: 0
                },
                parseData: function(res) {
                    return {
                        code: res.code,
                        msg: res.msg,
                        count: res.count,
                        data: res.data
                    };
                }
            });

        });
    </script>
    <script type="text/html" id="toolbar">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
    </script>
    <script>
        // 继续使用 layui 模块
        layui.use(['table', 'layer', 'form'], function(){
            var table = layui.table;
            var layer = layui.layer;
            var form = layui.form;
            var $ = layui.$;

            // 监听行工具事件
            table.on('tool(userTable)', function(obj){
                var data = obj.data;
                if(obj.event === 'edit'){
                    // 编辑用户
                    layer.open({
                        type: 1,
                        title: '编辑用户',
                        area: ['420px', '320px'],
                        content: [
                            '<form class="layui-form" style="padding:30px 20px 0;" lay-filter="editForm">',
                            '<input type="hidden" name="id" value="' + data.id + '">',
                            '<div class="layui-form-item">',
                            '<label class="layui-form-label">用户名</label>',
                            '<div class="layui-input-block">',
                            '<input type="text" name="username" required lay-verify="required"',
                            ' autocomplete="off" class="layui-input" value="' + data.username + '">',
                            '</div></div>',
                            '<div class="layui-form-item">',
                            '<label class="layui-form-label">密码</label>',
                            '<div class="layui-input-block">',
                            '<input type="password" name="password" placeholder="留空则不修改"',
                            ' autocomplete="off" class="layui-input">',
                            '</div></div>',
                            '<div class="layui-form-item" style="text-align:center;padding-top:10px;">',
                            '<button class="layui-btn" lay-submit lay-filter="editSubmit">保存</button>',
                            '<button class="layui-btn layui-btn-primary" type="button" onclick="layer.closeAll()">取消</button>',
                            '</div></form>'
                        ].join(''),
                        success: function(layero){
                            form.render(null, 'editForm');
                            // 表单提交
                            form.on('submit(editSubmit)', function(formData){
                                formData.field._xsrf = getXsrfToken();
                                $.post('/admin/user/edit', formData.field, function(res){
                                    if(res.code === 0){
                                        layer.msg('更新成功', {icon: 1});
                                        layer.closeAll();
                                        table.reload('userTable');
                                    } else {
                                        layer.msg(res.msg, {icon: 2});
                                    }
                                }, 'json');
                                return false;
                            });
                        }
                    });
                } else if(obj.event === 'del'){
                    // 删除用户
                    layer.confirm('确定要删除用户「' + data.username + '」吗？', {
                        title: '确认删除',
                        btn: ['确定', '取消']
                    }, function(index){
                        $.post('/admin/user/delete', {
                            id: data.id,
                            _xsrf: getXsrfToken()
                        }, function(res){
                            if(res.code === 0){
                                layer.msg('删除成功', {icon: 1});
                                table.reload('userTable');
                            } else {
                                layer.msg(res.msg, {icon: 2});
                            }
                        }, 'json');
                        layer.close(index);
                    });
                }
            });

            // 新增用户
            $('#btnAdd').on('click', function(){
                layer.open({
                    type: 1,
                    title: '新增用户',
                    area: ['420px', '320px'],
                    content: [
                        '<form class="layui-form" style="padding:30px 20px 0;" lay-filter="addForm">',
                        '<div class="layui-form-item">',
                        '<label class="layui-form-label">用户名</label>',
                        '<div class="layui-input-block">',
                        '<input type="text" name="username" required lay-verify="required"',
                        ' placeholder="请输入用户名" autocomplete="off" class="layui-input">',
                        '</div></div>',
                        '<div class="layui-form-item">',
                        '<label class="layui-form-label">密码</label>',
                        '<div class="layui-input-block">',
                        '<input type="password" name="password" required lay-verify="required"',
                        ' placeholder="请输入密码" autocomplete="off" class="layui-input">',
                        '</div></div>',
                        '<div class="layui-form-item" style="text-align:center;padding-top:10px;">',
                        '<button class="layui-btn" lay-submit lay-filter="addSubmit">提交</button>',
                        '<button class="layui-btn layui-btn-primary" type="button" onclick="layer.closeAll()">取消</button>',
                        '</div></form>'
                    ].join(''),
                    success: function(layero){
                        form.render(null, 'addForm');
                        form.on('submit(addSubmit)', function(formData){
                            formData.field._xsrf = getXsrfToken();
                            $.post('/admin/user/add', formData.field, function(res){
                                if(res.code === 0){
                                    layer.msg('新增成功', {icon: 1});
                                    layer.closeAll();
                                    table.reload('userTable');
                                } else {
                                    layer.msg(res.msg, {icon: 2});
                                }
                            }, 'json');
                            return false;
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
