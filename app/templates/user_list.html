<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        .main-container { padding: 15px; }
        .toolbar-box { padding: 10px 0; margin-bottom:15px; }
        .layui-table-page { text-align: center; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="toolbar-box">
            <button class="layui-btn layui-btn-sm" id="btnAdd">
                <i class="layui-icon layui-icon-add-1"></i> 新增用户
            </button>
        </div>
        <table id="userTable" lay-filter="userTable"></table>
    </div>

    <script src="{{ static_url('dist/layui/layui.js') }}"></script>
    <script>
        function getXsrfToken() {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var c = cookies[i].trim();
                if (c.indexOf('_xsrf=') === 0) return c.substring(6);
            }
            return '';
        }

        // 缓存角色列表
        var roleOptions = [];

        layui.use(['table', 'layer', 'form'], function(){
            var table = layui.table;
            var layer = layui.layer;
            var form = layui.form;
            var $ = layui.$;

            // 先加载角色列表
            $.getJSON('/admin/user/roles', function(roles){
                roleOptions = roles;
            });

            table.render({
                elem: '#userTable',
                url: '/admin/user/list',
                page: { limit: 28, limits: [28, 50, 100] },
                cols: [[
                    {type: 'numbers', title: '序号', width: 80, align: 'center'},
                    {field: 'id', title: 'ID', width: 80, align: 'center', sort: true},
                    {field: 'username', title: '用户名', width: 180, align: 'center'},
                    {field: 'role_name', title: '角色', width: 150, align: 'center', templet: function(d){
                        return '<span class="layui-badge layui-bg-blue">' + (d.role_name || '普通用户') + '</span>';
                    }},
                    {field: 'create_at', title: '创建时间', width: 250, align: 'center', sort: true},
                    {title: '操作', width: 220, align: 'center', toolbar: '#toolbar'}
                ]],
                response: { statusCode: 0 },
                parseData: function(res) {
                    return { code: res.code, msg: res.msg, count: res.count, data: res.data };
                }
            });

            table.on('tool(userTable)', function(obj){
                var data = obj.data;
                if(obj.event === 'edit'){
                    // 构建角色下拉选项
                    var roleSelectHtml = '';
                    $.each(roleOptions, function(i, r){
                        var selected = (r.id == data.role_id) ? ' selected' : '';
                        roleSelectHtml += '<option value="' + r.id + '"' + selected + '>' + r.name + '</option>';
                    });

                    layer.open({
                        type: 1,
                        title: '编辑用户',
                        area: ['450px', '400px'],
                        content: [
                            '<form class="layui-form" style="padding:30px 20px 0;" lay-filter="editForm">',
                            '<input type="hidden" name="id" value="' + data.id + '">',
                            '<div class="layui-form-item">',
                            '<label class="layui-form-label">用户名</label>',
                            '<div class="layui-input-block">',
                            '<input type="text" name="username" required lay-verify="required" autocomplete="off" class="layui-input" value="' + data.username + '">',
                            '</div></div>',
                            '<div class="layui-form-item">',
                            '<label class="layui-form-label">密码</label>',
                            '<div class="layui-input-block">',
                            '<input type="password" name="password" placeholder="留空则不修改" autocomplete="off" class="layui-input">',
                            '</div></div>',
                            '<div class="layui-form-item">',
                            '<label class="layui-form-label">角色</label>',
                            '<div class="layui-input-block">',
                            '<select name="role_id">' + roleSelectHtml + '</select>',
                            '</div></div>',
                            '<div class="layui-form-item" style="text-align:center;padding-top:10px;">',
                            '<button class="layui-btn" lay-submit lay-filter="editSubmit">保存</button>',
                            '<button class="layui-btn layui-btn-primary" type="button" onclick="layer.closeAll()">取消</button>',
                            '</div></form>'
                        ].join(''),
                        success: function(layero){
                            form.render(null, 'editForm');
                            form.on('submit(editSubmit)', function(formData){
                                formData.field._xsrf = getXsrfToken();
                                $.post('/admin/user/edit', formData.field, function(res){
                                    if(res.code === 0){ layer.msg('更新成功', {icon:1}); layer.closeAll(); table.reload('userTable'); }
                                    else layer.msg(res.msg, {icon:2});
                                },'json');
                                return false;
                            });
                        }
                    });
                } else if(obj.event === 'del'){
                    layer.confirm('确定要删除用户「' + data.username + '」吗？', { title: '确认删除', btn: ['确定', '取消'] }, function(index){
                        $.post('/admin/user/delete', { id: data.id, _xsrf: getXsrfToken() }, function(res){
                            if(res.code === 0){ layer.msg('删除成功', {icon:1}); table.reload('userTable'); }
                            else layer.msg(res.msg, {icon:2});
                        },'json');
                        layer.close(index);
                    });
                }
            });

            $('#btnAdd').on('click', function(){
                var roleSelectHtml = '';
                $.each(roleOptions, function(i, r){
                    var selected = (r.id == 2) ? ' selected' : '';  // 默认选中"普通用户"
                    roleSelectHtml += '<option value="' + r.id + '"' + selected + '>' + r.name + '</option>';
                });

                layer.open({
                    type: 1,
                    title: '新增用户',
                    area: ['450px', '420px'],
                    content: [
                        '<form class="layui-form" style="padding:30px 20px 0;" lay-filter="addForm">',
                        '<div class="layui-form-item">',
                        '<label class="layui-form-label">用户名</label>',
                        '<div class="layui-input-block">',
                        '<input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">',
                        '</div></div>',
                        '<div class="layui-form-item">',
                        '<label class="layui-form-label">密码</label>',
                        '<div class="layui-input-block">',
                        '<input type="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">',
                        '</div></div>',
                        '<div class="layui-form-item">',
                        '<label class="layui-form-label">角色</label>',
                        '<div class="layui-input-block">',
                        '<select name="role_id">' + roleSelectHtml + '</select>',
                        '<div style="color:#999;font-size:12px;margin-top:5px;">不同角色拥有不同的功能权限</div>',
                        '</div></div>',
                        '<div class="layui-form-item" style="text-align:center;padding-top:10px;">',
                        '<button class="layui-btn" lay-submit lay-filter="addSubmit">提交</button>',
                        '<button class="layui-btn layui-btn-primary" type="button" onclick="layer.closeAll()">取消</button>',
                        '</div></form>'
                    ].join(''),
                    success: function(layero){
                        form.render(null, 'addForm');
                        form.on('submit(addSubmit)', function(formData){
                            formData.field._xsrf = getXsrfToken();
                            $.post('/admin/user/add', formData.field, function(res){
                                if(res.code === 0){ layer.msg('新增成功', {icon:1}); layer.closeAll(); table.reload('userTable'); }
                                else layer.msg(res.msg, {icon:2});
                            },'json');
                            return false;
                        });
                    }
                });
            });
        });
    </script>
    <script type="text/html" id="toolbar">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
    </script>
</body>
</html>
