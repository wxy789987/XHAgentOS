<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:#0a0e1a; color:#c8d6e5; min-height:100vh; }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:#0a0e1a; }
        ::-webkit-scrollbar-thumb { background:#2d3a6e; border-radius:3px; }

        .page-header { padding:24px 30px 10px 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,255,255,.1); }
        .page-header h1 { font-size:24px; font-weight:700; background:linear-gradient(135deg,#00d2ff,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .page-header .actions { display:flex; gap:12px; align-items:center; }

        .btn-primary, .btn-secondary, .btn-danger, .btn-sm { padding:8px 20px; border:none; border-radius:6px; cursor:pointer; font-size:14px; transition:all .3s; }
        .btn-primary { background:linear-gradient(135deg,#00d2ff,#3b82f6); color:#fff; }
        .btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 15px rgba(0,210,255,.3); }
        .btn-secondary { border:1px solid rgba(0,255,255,.2); background:transparent; color:#00d2ff; }
        .btn-secondary:hover { background:rgba(0,255,255,.05); border-color:#00d2ff; }
        .btn-danger { background:linear-gradient(135deg,#ff6b6b,#ee5a24); color:#fff; }
        .btn-sm { padding:5px 12px; font-size:12px; }

        .content { padding:20px 30px; }
        .filter-bar { display:flex; gap:12px; align-items:center; margin-bottom:20px; }
        .filter-bar input { padding:8px 14px; border:1px solid rgba(0,255,255,.15); border-radius:6px; background:rgba(255,255,255,.05); color:#c8d6e5; font-size:14px; outline:none; transition:all .3s; min-width:220px; }
        .filter-bar input:focus { border-color:#00d2ff; box-shadow:0 0 8px rgba(0,210,255,.15); }

        .dia-table { width:100%; border-collapse:collapse; margin-bottom:20px; }
        .dia-table th, .dia-table td { padding:12px 14px; text-align:left; border-bottom:1px solid rgba(255,255,255,.05); font-size:13px; }
        .dia-table th { color:rgba(255,255,255,.4); font-weight:500; background:rgba(255,255,255,.02); }
        .dia-table td { color:#e2e8f0; }
        .dia-table tr:hover td { background:rgba(0,210,255,.03); }
        .dia-table .name-link { color:#00d2ff; cursor:pointer; text-decoration:none; }
        .dia-table .name-link:hover { color:#a855f7; }
        .dia-table .content-preview { color:rgba(255,255,255,.5); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .pagination { display:flex; justify-content:center; gap:8px; align-items:center; padding:20px 0; color:rgba(255,255,255,.5); font-size:13px; }
        .pagination button { padding:6px 14px; border:1px solid rgba(0,255,255,.15); border-radius:6px; background:transparent; color:#c8d6e5; cursor:pointer; }
        .pagination button:hover { border-color:#00d2ff; }
        .pagination button:disabled { opacity:.3; cursor:not-allowed; }
        .pagination .page-info { padding:0 10px; }

        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.7); z-index:1000; align-items:center; justify-content:center; }
        .modal-overlay.show { display:flex; }
        .modal-box { background:#1a1f3a; border:1px solid rgba(0,255,255,.15); border-radius:16px; width:620px; max-width:90vw; max-height:85vh; overflow-y:auto; padding:30px; position:relative; }
        .modal-box h2 { font-size:20px; margin-bottom:20px; color:#e2e8f0; }
        .modal-close { position:absolute; top:15px; right:20px; cursor:pointer; font-size:24px; color:rgba(255,255,255,.3); }
        .modal-close:hover { color:#ff6b6b; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; margin-bottom:6px; font-size:13px; color:rgba(255,255,255,.6); }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 14px; border:1px solid rgba(0,255,255,.15); border-radius:8px; background:rgba(255,255,255,.05); color:#c8d6e5; font-size:14px; outline:none; transition:all .3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#00d2ff; box-shadow:0 0 8px rgba(0,210,255,.15); }
        .form-group textarea { min-height:80px; resize:vertical; }
        .form-group .help-text { font-size:12px; color:rgba(255,255,255,.35); margin-top:4px; }

        .toast { position:fixed; top:20px; right:20px; padding:12px 24px; border-radius:8px; z-index:2000; display:none; font-size:14px; }
        .toast.success { background:rgba(0,200,83,.9); color:#fff; display:block; }
        .toast.error { background:rgba(255,77,77,.9); color:#fff; display:block; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>对话管理</h1>
        <div class="actions"><button class="btn-primary" onclick="showAddModal()">+ 新增对话记录</button></div>
    </div>
    <div class="content">
        <div class="filter-bar"><input type="text" id="fKeyword" placeholder="搜索对话名称/内容..." oninput="doSearch()"></div>
        <table class="dia-table">
            <thead><tr><th>ID</th><th>名称</th><th>内容预览</th><th>描述</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="diaTbody"></tbody>
        </table>
        <div id="pagination" class="pagination"></div>
    </div>

    <div class="modal-overlay" id="diaModal">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal('diaModal')">&times;</span>
            <h2 id="modalTitle">新增对话记录</h2>
            <input type="hidden" id="editId" value="0">
            <div class="form-group"><label>名称 <span style="color:#ff6b6b;">*</span></label><input type="text" id="fName" placeholder="如：客户咨询欢迎语"></div>
            <div class="form-group"><label>内容 <span style="color:#ff6b6b;">*</span></label><textarea id="fContent" rows="4" placeholder="对话记录的具体内容..."></textarea></div>
            <div class="form-group"><label>描述</label><textarea id="fDesc" rows="2" placeholder="简单描述这个对话记录的用途..."></textarea></div>
            <div class="form-group"><label>关联AI模型</label><select id="fModel"><option value="0">不指定（使用默认模型）</option></select></div>
            <div class="form-group"><label>系统提示词</label><textarea id="fSysPrompt" rows="3" placeholder="可选，调用时作为 system 角色的提示词..."></textarea></div>
            <div style="text-align:right;margin-top:20px;">
                <button class="btn-secondary" onclick="closeModal('diaModal')" style="margin-right:10px;">取消</button>
                <button class="btn-primary" onclick="saveDialogue()">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script>
        function getXsrfToken(){var c=document.cookie.split(';');for(var i=0;i<c.length;i++){var d=c[i].trim();if(d.indexOf('_xsrf=')===0)return d.substring(6);}return '';}
        var xsrf=getXsrfToken(), currentPage=1, allModels=[];

        function doSearch(){currentPage=1;loadDialogues();}
        function loadDialogues(){
            var kw=document.getElementById('fKeyword').value;
            fetch('/admin/dialogue/list?page='+currentPage+'&page_size=15&keyword='+encodeURIComponent(kw))
            .then(function(r){return r.json();})
            .then(function(data){
                var html='';
                if(data.items&&data.items.length>0){
                    data.items.forEach(function(d){
                        html+='<tr><td>'+d.id+'</td>';
                        html+='<td><a class="name-link" href="/admin/dialogue/detail?id='+d.id+'" target="_blank">'+escapeHtml(d.name)+'</a></td>';
                        html+='<td class="content-preview">'+escapeHtml(d.content||'')+'</td>';
                        html+='<td style="color:rgba(255,255,255,.4);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.description||'')+'</td>';
                        html+='<td style="color:rgba(255,255,255,.4);font-size:12px;">'+(d.create_at||'')+'</td>';
                        html+='<td>';
                        html+='<button class="btn-secondary btn-sm" onclick="testDialogue('+d.id+')" style="margin-right:4px;">测试</button>';
                        html+='<button class="btn-secondary btn-sm" onclick="editDialogue('+d.id+')" style="margin-right:4px;">编辑</button>';
                        html+='<button class="btn-danger btn-sm" onclick="deleteDialogue('+d.id+')">删除</button>';
                        html+='</td></tr>';
                    });
                } else {
                    html='<tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,.3);">暂无对话记录</td></tr>';
                }
                document.getElementById('diaTbody').innerHTML=html;
                renderPagination(data);
            });
        }
        function escapeHtml(t){if(!t)return '';return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
        function renderPagination(data){
            var total=data.total||0, page=data.page||1, size=data.page_size||15, pages=Math.max(1,Math.ceil(total/size));
            var html='<button onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>上一页</button>';
            html+='<span class="page-info">'+page+'/'+pages+'</span>';
            html+='<button onclick="goPage('+(page+1)+')" '+(page>=pages?'disabled':'')+'>下一页</button>';
            document.getElementById('pagination').innerHTML=html;
        }
        function goPage(p){currentPage=p;loadDialogues();}

        function loadModels(){
            fetch('/admin/dialogue/models').then(function(r){return r.json();}).then(function(res){
                if(res.code===0) allModels=res.data||[];
                renderModelSelect(0);
            });
        }
        function renderModelSelect(selectedId){
            var sel=document.getElementById('fModel');
            sel.innerHTML='<option value="0">不指定（使用默认模型）</option>';
            allModels.forEach(function(m){sel.innerHTML+='<option value="'+m.id+'" '+(m.id===selectedId?'selected':'')+'>'+escapeHtml(m.name)+'</option>';});
        }

        function showAddModal(){
            document.getElementById('modalTitle').textContent='新增对话记录';
            document.getElementById('editId').value='0';
            document.getElementById('fName').value='';
            document.getElementById('fContent').value='';
            document.getElementById('fDesc').value='';
            document.getElementById('fSysPrompt').value='';
            renderModelSelect(0);
            document.getElementById('diaModal').classList.add('show');
        }
        function editDialogue(id){
            document.getElementById('modalTitle').textContent='编辑对话记录';
            document.getElementById('editId').value=id;
            fetch('/admin/dialogue/get?id='+id).then(function(r){return r.json();}).then(function(res){
                if(res.code!==0){showToast('error',res.msg);return;}
                var d=res.data;
                document.getElementById('fName').value=d.name||'';
                document.getElementById('fContent').value=d.content||'';
                document.getElementById('fDesc').value=d.description||'';
                document.getElementById('fSysPrompt').value=d.system_prompt||'';
                renderModelSelect(d.model_id||0);
                document.getElementById('diaModal').classList.add('show');
            });
        }
        function saveDialogue(){
            var id=document.getElementById('editId').value;
            var name=document.getElementById('fName').value.trim();
            var content=document.getElementById('fContent').value.trim();
            var desc=document.getElementById('fDesc').value.trim();
            var modelId=parseInt(document.getElementById('fModel').value)||0;
            var sysPrompt=document.getElementById('fSysPrompt').value.trim();
            if(!name){showToast('error','名称不能为空');return;}
            if(!content){showToast('error','内容不能为空');return;}
            var url=id>0?'/admin/dialogue/edit':'/admin/dialogue/add';
            var body='name='+encodeURIComponent(name)+'&content='+encodeURIComponent(content)+'&description='+encodeURIComponent(desc)+'&model_id='+modelId+'&system_prompt='+encodeURIComponent(sysPrompt)+'&_xsrf='+xsrf;
            if(id>0) body+='&id='+id;
            fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
            .then(function(r){return r.json();}).then(function(res){
                if(res.code===0){showToast('success',id>0?'更新成功':'新增成功');closeModal('diaModal');loadDialogues();}
                else {showToast('error',res.msg);}
            });
        }
        function deleteDialogue(id){
            if(!confirm('确定删除该对话记录吗？')) return;
            fetch('/admin/dialogue/delete',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'id='+id+'&_xsrf='+xsrf})
            .then(function(r){return r.json();}).then(function(res){if(res.code===0){showToast('success','删除成功');loadDialogues();}else{showToast('error',res.msg);}});
        }

        // 测试弹窗
        var testModalHtml='<div class="modal-overlay" id="testModal"><div class="modal-box"><span class="modal-close" onclick="closeModal(\'testModal\')">&times;</span>';
        testModalHtml+='<h2 id="testTitle">测试对话</h2><input type="hidden" id="testDialogueId" value="0">';
        testModalHtml+='<div class="form-group"><label>输入内容（可选，留空则直接使用对话内容）</label><textarea id="testInput" rows="3" placeholder="输入要提问的内容，留空则直接调用对话内容..."></textarea></div>';
        testModalHtml+='<div id="testResult" style="display:none;background:rgba(0,0,0,.3);border-radius:8px;padding:15px;margin-top:10px;max-height:300px;overflow:auto;"></div>';
        testModalHtml+='<div style="text-align:right;margin-top:20px;"><button class="btn-secondary" onclick="closeModal(\'testModal\')" style="margin-right:10px;">关闭</button><button class="btn-primary" id="testBtn" onclick="executeTest()">执行</button></div></div></div>';
        document.body.insertAdjacentHTML('beforeend', testModalHtml);

        function testDialogue(id){
            document.getElementById('testDialogueId').value=id;
            document.getElementById('testTitle').textContent='测试对话';
            document.getElementById('testInput').value='';
            document.getElementById('testResult').style.display='none';
            document.getElementById('testBtn').disabled=false;
            document.getElementById('testBtn').textContent='执行';
            document.getElementById('testModal').classList.add('show');
        }
        function executeTest(){
            var did=document.getElementById('testDialogueId').value;
            var input=document.getElementById('testInput').value.trim();
            document.getElementById('testBtn').disabled=true;
            document.getElementById('testBtn').textContent='执行中...';
            document.getElementById('testResult').style.display='none';
            fetch('/admin/dialogue/call',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'dialogue_id='+did+'&input_text='+encodeURIComponent(input)+'&_xsrf='+xsrf})
            .then(function(r){return r.json();}).then(function(res){
                document.getElementById('testBtn').disabled=false;
                document.getElementById('testBtn').textContent='执行';
                var html='';
                if(res.code===0&&res.data){
                    html+='<div style="color:#5FB878;margin-bottom:8px;">调用成功</div>';
                    html+='<div style="color:rgba(255,255,255,.5);font-size:12px;margin-bottom:6px;">模型: '+escapeHtml(res.data.model||'')+'</div>';
                    html+='<pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;color:#00d2ff;">'+escapeHtml(res.data.reply||JSON.stringify(res.data,null,2))+'</pre>';
                } else {
                    html+='<div style="color:#ff6b6b;margin-bottom:8px;">调用失败: '+escapeHtml(res.msg)+'</div>';
                }
                document.getElementById('testResult').innerHTML=html;
                document.getElementById('testResult').style.display='block';
            }).catch(function(err){
                document.getElementById('testBtn').disabled=false;
                document.getElementById('testBtn').textContent='执行';
                document.getElementById('testResult').innerHTML='<div style="color:#ff6b6b;">执行失败: '+escapeHtml(err.message)+'</div>';
                document.getElementById('testResult').style.display='block';
            });
        }

        function closeModal(id){document.getElementById(id).classList.remove('show');}
        function showToast(type,msg){
            var el=document.getElementById('toast');
            el.className='toast '+type; el.textContent=msg; el.style.display='block';
            setTimeout(function(){el.style.display='none';},3000);
        }
        loadModels(); loadDialogues();
    </script>
</body>
</html>
