<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0e1a;
            color: #c8d6e5;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0e1a; }
        ::-webkit-scrollbar-thumb { background: #2d3a6e; border-radius: 3px; }

        .page-header {
            padding: 24px 30px 10px 30px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0, 255, 255, .1);
        }
        .page-header h1 {
            font-size: 24px; font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header .actions { display: flex; gap: 12px; align-items: center; }

        .btn-neon {
            padding: 8px 22px; border: none; border-radius: 6px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all .3s; letter-spacing: 1px;
            font-family: inherit;
        }
        .btn-neon.primary {
            background: linear-gradient(135deg, #00d2ff, #3b82f6); color: #fff;
            box-shadow: 0 0 15px rgba(0, 210, 255, .3);
        }
        .btn-neon.primary:hover { box-shadow: 0 0 30px rgba(0, 210, 255, .5); transform: translateY(-2px); }
        .btn-neon.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff;
            box-shadow: 0 0 15px rgba(239, 68, 68, .3);
        }
        .btn-neon.danger:hover { box-shadow: 0 0 30px rgba(239, 68, 68, .5); transform: translateY(-2px); }
        .btn-neon.success {
            background: linear-gradient(135deg, #10b981, #059669); color: #fff;
            box-shadow: 0 0 15px rgba(16, 185, 129, .3);
        }
        .btn-neon.success:hover { box-shadow: 0 0 30px rgba(16, 185, 129, .5); transform: translateY(-2px); }

        .content-wrap { padding: 20px 30px; }

        /* 筛选栏 */
        .filter-bar {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
            padding: 16px 20px;
            background: rgba(10, 14, 26, .6);
            border: 1px solid rgba(0, 210, 255, .1);
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .filter-bar .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-bar .filter-group label { font-size: 11px; color: #64748b; }
        .filter-bar .filter-group input,
        .filter-bar .filter-group select {
            padding: 8px 12px;
            background: rgba(10,14,26,.8);
            border: 1px solid rgba(0,210,255,.15);
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 13px;
            outline: none;
            min-width: 120px;
        }
        .filter-bar .filter-group input:focus,
        .filter-bar .filter-group select:focus {
            border-color: #00d2ff;
        }

        /* 表格 */
        .table-wrap {
            background: rgba(10, 14, 26, .6);
            border: 1px solid rgba(0, 210, 255, .1);
            border-radius: 10px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        table th {
            background: rgba(0, 210, 255, .08);
            padding: 12px 16px; text-align: left;
            font-size: 13px; color: #94a3b8;
            border-bottom: 1px solid rgba(0, 210, 255, .1);
            font-weight: 600;
        }
        table td {
            padding: 12px 16px; font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,.04);
            color: #c8d6e5;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        table tr:hover td { background: rgba(0, 210, 255, .04); }

        .badge {
            display: inline-block; padding: 2px 10px;
            border-radius: 10px; font-size: 11px; font-weight: 600;
        }
        .badge.collected { background: rgba(16,185,129,.2); color: #10b981; }

        .action-link { color: #00d2ff; cursor: pointer; margin-right: 12px; transition: all .3s; font-size: 13px; }
        .action-link:hover { color: #a855f7; }
        .action-link.danger { color: #ef4444; }
        .action-link.danger:hover { color: #ff6b6b; }

        .pagination-bar {
            display: flex; justify-content: center; align-items: center;
            padding: 16px; gap: 8px;
        }
        .pagination-bar .page-btn {
            padding: 6px 14px; border: 1px solid rgba(0,210,255,.2);
            background: transparent; color: #94a3b8; border-radius: 4px;
            cursor: pointer; font-size: 13px; transition: all .3s;
        }
        .pagination-bar .page-btn:hover { border-color: #00d2ff; color: #00d2ff; }
        .pagination-bar .page-btn.active { background: #00d2ff; color: #fff; border-color: #00d2ff; }
        .pagination-bar .page-info { font-size: 13px; color: #64748b; margin: 0 8px; }

        /* 全选checkbox */
        input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #581cff;
            cursor: pointer;
        }

        /* 详情弹窗 */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: linear-gradient(145deg, #141c3a, #0a0e1a);
            border: 1px solid rgba(0,210,255,.2); border-radius: 16px;
            width: 700px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 0 60px rgba(0,210,255,.1);
        }
        .modal-header {
            padding: 18px 24px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid rgba(0,210,255,.1);
        }
        .modal-header h3 { font-size: 18px; color: #e2e8f0; }
        .modal-close {
            width: 32px; height: 32px; border: none; background: rgba(255,255,255,.05);
            border-radius: 50%; color: #94a3b8; font-size: 18px; cursor: pointer;
        }
        .modal-close:hover { background: rgba(239,68,68,.2); color: #ef4444; }
        .modal-body { padding: 24px; }
        .detail-field { margin-bottom: 14px; }
        .detail-field .field-label { font-size: 11px; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .detail-field .field-value { font-size: 14px; color: #e2e8f0; line-height: 1.6; }
        .detail-field .field-value a { color: #00d2ff; word-break: break-all; }

        .toast {
            position: fixed; top: 24px; right: 24px;
            padding: 12px 24px; border-radius: 8px; color: #fff;
            font-size: 14px; z-index: 2000; animation: toastIn .3s ease;
        }
        .toast.success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast.info { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>🗄️ 数据仓库</h1>
        <div class="actions">
            <button class="btn-neon success" onclick="exportData()">📥 导出Excel</button>
            <button class="btn-neon danger" onclick="batchDelete()">🗑️ 批量删除</button>
            <button class="btn-neon primary" onclick="location.href='/admin/lookout/collect'">⚡ 前往采集</button>
        </div>
    </div>
    <div class="content-wrap">
        <!-- 筛选栏 -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>采集源</label>
                <select id="filterSource"><option value="">全部</option></select>
            </div>
            <div class="filter-group">
                <label>关键词</label>
                <input type="text" id="filterKeyword" placeholder="标题/摘要/关键词">
            </div>
            <div class="filter-group">
                <label>开始时间</label>
                <input type="date" id="filterDateFrom">
            </div>
            <div class="filter-group">
                <label>结束时间</label>
                <input type="date" id="filterDateTo">
            </div>
            <div class="filter-group">
                <label>状态</label>
                <select id="filterStatus">
                    <option value="">全部</option>
                    <option value="collected">已采集</option>
                </select>
            </div>
            <button class="btn-neon primary" onclick="loadData(1)" style="padding:8px 16px;font-size:12px;">🔍 查询</button>
            <button class="btn-neon" onclick="resetFilter()" style="padding:8px 16px;font-size:12px;background:rgba(255,255,255,.05);color:#94a3b8;">重置</button>
        </div>

        <!-- 数据表格 -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px;"><input type="checkbox" onchange="toggleAllCheckbox(this)"></th>
                        <th style="width:60px;">ID</th>
                        <th style="width:100px;">采集源</th>
                        <th>标题</th>
                        <th style="width:160px;">摘要</th>
                        <th style="width:100px;">发布时间</th>
                        <th style="width:80px;">状态</th>
                        <th style="width:160px;">采集时间</th>
                        <th style="width:80px;">操作</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody"></tbody>
            </table>
            <div class="pagination-bar" id="paginationBar"></div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>📄 数据详情</h3>
                <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
            </div>
            <div class="modal-body" id="detailBody"></div>
        </div>
    </div>

    <script src="{{ static_url('dist/layui/layui.js') }}"></script>
    <script>
    var currentPage = 1;
    var selectedIds = new Set();

    document.addEventListener('DOMContentLoaded', function(){
        loadSources();
        loadData(1);
    });

    function loadSources(){
        fetch('/admin/lookout/source/active')
            .then(r => r.json())
            .then(function(data){
                var sel = document.getElementById('filterSource');
                (data.items || []).forEach(function(s){
                    var opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    sel.appendChild(opt);
                });
            });
    }

    function getFilterParams(){
        return {
            page: currentPage,
            page_size: 20,
            source_id: document.getElementById('filterSource').value,
            keyword: document.getElementById('filterKeyword').value.trim(),
            date_from: document.getElementById('filterDateFrom').value,
            date_to: document.getElementById('filterDateTo').value,
            status: document.getElementById('filterStatus').value,
        };
    }

    function loadData(page){
        currentPage = page;
        selectedIds.clear();
        var params = getFilterParams();
        var qs = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');

        fetch('/admin/lookout/warehouse/list?' + qs)
            .then(r => r.json())
            .then(function(data){
                var html = '';
                data.items.forEach(function(item){
                    var checked = selectedIds.has(item.id) ? 'checked' : '';
                    html += '<tr>';
                    html += '<td><input type="checkbox" value="' + item.id + '" ' + checked + ' onchange="toggleSelect(this)"></td>';
                    html += '<td>' + item.id + '</td>';
                    html += '<td>' + escapeHtml(item.source_name || '-') + '</td>';
                    html += '<td><a href="javascript:;" onclick="showDetail(' + item.id + ')" style="color:#e2e8f0;text-decoration:none;">' + escapeHtml((item.title || '').substring(0, 50)) + '</a></td>';
                    html += '<td>' + escapeHtml((item.summary || '').substring(0, 60)) + '</td>';
                    html += '<td>' + (item.publish_time || '-') + '</td>';
                    html += '<td><span class="badge collected">已采集</span></td>';
                    html += '<td>' + (item.create_at || '') + '</td>';
                    html += '<td><span class="action-link" onclick="showDetail(' + item.id + ')">查看</span></td>';
                    html += '</tr>';
                });
                if(data.items.length === 0){
                    html = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#475569;">暂无数据</td></tr>';
                }
                document.getElementById('dataTableBody').innerHTML = html;
                renderPagination(data);
            });
    }

    function renderPagination(data){
        var bar = document.getElementById('paginationBar');
        if(data.total <= data.page_size){
            bar.innerHTML = '';
            return;
        }
        var total = Math.ceil(data.total / data.page_size);
        var html = '<button class="page-btn" onclick="loadData(1)">首页</button>';
        html += '<button class="page-btn" onclick="loadData(Math.max(1,' + (currentPage-1) + '))">‹</button>';
        html += '<span class="page-info">' + currentPage + ' / ' + total + '</span>';
        html += '<button class="page-btn" onclick="loadData(Math.min(' + total + ',' + (currentPage+1) + '))">›</button>';
        html += '<button class="page-btn" onclick="loadData(' + total + ')">末页</button>';
        bar.innerHTML = html;
    }

    function toggleAllCheckbox(el){
        var cbs = document.querySelectorAll('#dataTableBody input[type="checkbox"]');
        cbs.forEach(function(cb){
            cb.checked = el.checked;
            if(el.checked){
                selectedIds.add(parseInt(cb.value));
            } else {
                selectedIds.delete(parseInt(cb.value));
            }
        });
    }

    function toggleSelect(el){
        var id = parseInt(el.value);
        if(el.checked){
            selectedIds.add(id);
        } else {
            selectedIds.delete(id);
        }
    }

    function resetFilter(){
        document.getElementById('filterSource').value = '';
        document.getElementById('filterKeyword').value = '';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('filterStatus').value = '';
        loadData(1);
    }

    function showDetail(id){
        fetch('/admin/lookout/warehouse/list?page=1&page_size=100')
            .then(r => r.json())
            .then(function(data){
                var item = data.items.find(function(d){ return d.id == id; });
                if(!item){ showToast('error', '未找到数据'); return; }
                var html = '';
                html += '<div class="detail-field"><div class="field-label">标题</div><div class="field-value">' + escapeHtml(item.title) + '</div></div>';
                html += '<div class="detail-field"><div class="field-label">采集源</div><div class="field-value">' + escapeHtml(item.source_name || '未知') + '</div></div>';
                html += '<div class="detail-field"><div class="field-label">链接</div><div class="field-value"><a href="' + escapeHtml(item.url) + '" target="_blank">' + escapeHtml(item.url) + '</a></div></div>';
                html += '<div class="detail-field"><div class="field-label">摘要</div><div class="field-value">' + escapeHtml(item.summary || '无') + '</div></div>';
                html += '<div class="detail-field"><div class="field-label">发布时间</div><div class="field-value">' + (item.publish_time || '未知') + '</div></div>';
                html += '<div class="detail-field"><div class="field-label">关键词</div><div class="field-value">' + escapeHtml(item.keywords || '无') + '</div></div>';
                html += '<div class="detail-field"><div class="field-label">采集时间</div><div class="field-value">' + (item.create_at || '') + '</div></div>';
                document.getElementById('detailBody').innerHTML = html;
                showModal('detailModal');
            });
    }

    function batchDelete(){
        var ids = [];
        document.querySelectorAll('#dataTableBody input[type="checkbox"]:checked').forEach(function(cb){
            ids.push(parseInt(cb.value));
        });
        if(ids.length === 0){
            showToast('error', '请先选择要删除的记录');
            return;
        }
        if(!confirm('确定要删除选中的 ' + ids.length + ' 条记录吗？')) return;

        fetch('/admin/lookout/warehouse/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-XSRFToken': getXsrfToken() },
            body: 'ids=' + encodeURIComponent(JSON.stringify(ids))
        })
        .then(r => r.json())
        .then(function(res){
            if(res.code == 0){
                showToast('success', res.msg);
                loadData(currentPage);
            } else {
                showToast('error', res.msg);
            }
        });
    }

    function exportData(){
        var params = getFilterParams();
        var qs = Object.keys(params).map(function(k){
            if(k === 'page' || k === 'page_size') return '';
            return params[k] ? k + '=' + encodeURIComponent(params[k]) : '';
        }).filter(Boolean).join('&');

        window.open('/admin/lookout/export?' + qs, '_blank');
        showToast('info', '正在导出，请稍候...');
    }

    function showToast(type, msg){
        var div = document.createElement('div');
        div.className = 'toast ' + type;
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(function(){ div.remove(); }, 2500);
    }

    function showModal(id){ document.getElementById(id).classList.add('show'); }
    function closeModal(id){ document.getElementById(id).classList.remove('show'); }

    function getXsrfToken(){
        var match = document.cookie.match(/_xsrf=([^;]+)/);
        return match ? match[1] : '';
    }

    function escapeHtml(str){
        if(!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    </script>
</body>
</html>
