<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:#0a0e1a; color:#c8d6e5; min-height:100vh; padding:30px; }
        ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:#0a0e1a;}::-webkit-scrollbar-thumb{background:#2d3a6e;border-radius:3px;}

        .back-link{display:inline-block;margin-bottom:20px;color:#00d2ff;text-decoration:none;font-size:14px;}
        .back-link:hover{color:#a855f7;}

        .card{background:linear-gradient(135deg,rgba(15,23,58,.8),rgba(30,27,75,.8));border:1px solid rgba(0,255,255,.1);border-radius:16px;padding:24px;margin-bottom:20px;}
        .card h2{font-size:20px;color:#e2e8f0;margin-bottom:16px;}
        .card h3{font-size:15px;color:#00d2ff;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(0,255,255,.1);}

        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;}
        .info-item label{display:block;font-size:12px;color:rgba(255,255,255,.4);margin-bottom:4px;}
        .info-item .value{font-size:14px;color:#e2e8f0;}

        .code-block{background:rgba(0,0,0,.4);border-radius:8px;padding:16px;margin:8px 0;overflow-x:auto;}
        .code-block pre{font-size:13px;color:#00d2ff;white-space:pre-wrap;word-break:break-all;font-family:'Cascadia Code','Fira Code',monospace;line-height:1.6;}

        .log-item{padding:12px 16px;border:1px solid rgba(255,255,255,.05);border-radius:8px;margin-bottom:8px;}
        .log-item:hover{border-color:rgba(0,210,255,.15);}
        .log-item .log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
        .log-item .log-status{padding:2px 8px;border-radius:6px;font-size:11px;}
        .log-status.success{background:rgba(0,200,83,.15);color:#5FB878;}
        .log-status.failed{background:rgba(255,77,77,.15);color:#ff6b6b;}
        .log-item .log-body{font-size:12px;color:rgba(255,255,255,.5);}

        .btn-secondary{border:1px solid rgba(0,255,255,.2);background:transparent;color:#00d2ff;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;}
        .btn-secondary:hover{background:rgba(0,255,255,.05);}

        .empty-state{text-align:center;padding:40px 0;color:rgba(255,255,255,.3);font-size:14px;}
        .pagination{display:flex;justify-content:center;gap:8px;align-items:center;padding:12px 0;color:rgba(255,255,255,.5);font-size:13px;}
        .pagination button{padding:4px 12px;border:1px solid rgba(0,255,255,.15);border-radius:6px;background:transparent;color:#c8d6e5;cursor:pointer;font-size:12px;}
        .pagination button:hover{border-color:#00d2ff;}
        .pagination button:disabled{opacity:.3;cursor:not-allowed;}
        .pagination .page-info{padding:0 10px;}
    </style>
</head>
<body>
    <a class="back-link" href="javascript:history.back()">&larr; 返回对话列表</a>

    <div class="card" id="diaInfo"><div style="text-align:center;padding:40px;color:rgba(255,255,255,.3);">加载中...</div></div>

    <div class="card">
        <h3>调用记录</h3>
        <div id="callLogs"><div class="empty-state">暂无调用记录</div></div>
        <div id="logPagination" class="pagination"></div>
    </div>

    <script>
        function escapeHtml(t){if(!t)return '';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
        function getXsrfToken(){var c=document.cookie.split(';');for(var i=0;i<c.length;i++){var d=c[i].trim();if(d.indexOf('_xsrf=')===0)return d.substring(6);}return '';}
        var xsrf=getXsrfToken(), diaId='{{ dialogue_id }}', logPage=1;

        function loadDialogue(){
            fetch('/admin/dialogue/get?id='+diaId).then(function(r){return r.json();}).then(function(res){
                if(res.code!==0){document.getElementById('diaInfo').innerHTML='<div style="color:#ff6b6b;">加载失败: '+escapeHtml(res.msg)+'</div>';return;}
                var d=res.data;
                var html='<h2>'+escapeHtml(d.name)+'</h2>';
                html+='<div class="info-grid">';
                html+='<div class="info-item"><label>关联模型</label><div class="value">'+escapeHtml(d.model_name||'未选择')+'</div></div>';
                html+='<div class="info-item"><label>创建时间</label><div class="value">'+(d.create_at||'-')+'</div></div>';
                html+='<div class="info-item"><label>更新时间</label><div class="value">'+(d.update_at||'-')+'</div></div>';
                html+='<div class="info-item"><label>状态</label><div class="value">'+(d.is_active?'启用':'停用')+'</div></div>';
                html+='</div>';
                if(d.description) html+='<div style="color:rgba(255,255,255,.6);margin-bottom:12px;">'+escapeHtml(d.description)+'</div>';
                html+='<h3>对话内容</h3><div class="code-block"><pre>'+escapeHtml(d.content||'')+'</pre></div>';
                if(d.system_prompt){html+='<h3>系统提示词</h3><div class="code-block"><pre>'+escapeHtml(d.system_prompt)+'</pre></div>';}
                document.getElementById('diaInfo').innerHTML=html;
            });
        }

        function loadLogs(){
            fetch('/admin/dialogue/logs?dialogue_id='+diaId+'&page='+logPage+'&page_size=10').then(function(r){return r.json();}).then(function(data){
                if(!data.items||data.items.length===0){document.getElementById('callLogs').innerHTML='<div class="empty-state">暂无调用记录</div>';document.getElementById('logPagination').innerHTML='';return;}
                var html='';
                data.items.forEach(function(log){
                    var sc=log.status==='success'?'success':'failed', sl=log.status==='success'?'成功':'失败';
                    var ip='';try{ip=JSON.stringify(JSON.parse(log.input_data),null,2).substring(0,200);}catch(e){ip=(log.input_data||'').substring(0,200);}
                    var op='';try{op=JSON.stringify(JSON.parse(log.output_data),null,2).substring(0,200);}catch(e){op=(log.output_data||'').substring(0,200);}
                    html+='<div class="log-item"><div class="log-header"><span><span class="log-status '+sc+'">'+sl+'</span><span style="color:rgba(255,255,255,.3);font-size:12px;margin-left:8px;">'+(log.created_at||'')+'</span></span><span style="color:rgba(255,255,255,.3);font-size:12px;">'+(log.duration_ms||0)+'ms</span></div>';
                    html+='<div class="log-body"><details><summary>输入数据</summary><pre>'+escapeHtml(ip)+'</pre></details>';
                    html+='<details style="margin-top:4px;"><summary>输出数据</summary><pre>'+escapeHtml(op)+'</pre></details>';
                    if(log.error_message) html+='<div style="color:#ff6b6b;font-size:12px;margin-top:4px;">'+escapeHtml(log.error_message)+'</div>';
                    html+='</div></div>';
                });
                document.getElementById('callLogs').innerHTML=html;
                var t=data.total||0, p=Math.max(1,Math.ceil(t/data.page_size));
                var ph='<button onclick="goLogPage('+(logPage-1)+')" '+(logPage<=1?'disabled':'')+' style="padding:4px 12px;border:1px solid rgba(0,255,255,.15);border-radius:6px;background:transparent;color:#c8d6e5;cursor:pointer;font-size:12px;">上一页</button>';
                ph+=' <span style="padding:0 10px;font-size:12px;">'+logPage+'/'+p+'</span> ';
                ph+='<button onclick="goLogPage('+(logPage+1)+')" '+(logPage>=p?'disabled':'')+' style="padding:4px 12px;border:1px solid rgba(0,255,255,.15);border-radius:6px;background:transparent;color:#c8d6e5;cursor:pointer;font-size:12px;">下一页</button>';
                document.getElementById('logPagination').innerHTML=ph;
            });
        }
        function goLogPage(p){logPage=p;loadLogs();}
        loadDialogue();loadLogs();
    </script>
</body>
</html>
