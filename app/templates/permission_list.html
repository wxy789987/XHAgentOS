<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        .perm-container { padding: 15px; display: flex; gap: 20px; }
        .perm-left { width: 260px; background: #fff; border-radius: 4px; border: 1px solid #e6e6e6; padding: 15px; }
        .perm-right { flex: 1; background: #fff; border-radius: 4px; border: 1px solid #e6e6e6; padding: 15px; min-height: 400px; }
        .perm-right .feature-item { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
        .perm-right .feature-item:hover { background: #f8f8f8; }
        .perm-right .feature-item label { cursor: pointer; }
        .perm-right .feature-child { padding-left: 30px; }
        .perm-right .feature-parent { font-weight: bold; margin-top: 10px; }
        .perm-right .feature-parent:first-child { margin-top: 0; }
    </style>
</head>
<body>
    <div class="perm-container">
        <!-- 左侧角色列表 -->
        <div class="perm-left">
            <div style="font-size:15px;font-weight:bold;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #3b7cff;">
                <i class="layui-icon layui-icon-auz"></i> 选择角色
            </div>
            <div id="roleList"></div>
        </div>
        <!-- 右侧权限树 -->
        <div class="perm-right">
            <div style="font-size:15px;font-weight:bold;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #3b7cff;">
                <i class="layui-icon layui-icon-password"></i> 功能权限
                <span id="currentRoleName" style="font-weight:normal;font-size:13px;color:#999;margin-left:10px;"></span>
            </div>
            <div id="featureTree"></div>
            <div style="margin-top:15px;padding-top:15px;border-top:1px solid #e6e6e6;text-align:center;">
                <button class="layui-btn layui-btn-sm" id="btnSavePerm" disabled>
                    <i class="layui-icon layui-icon-ok"></i> 保存权限
                </button>
            </div>
        </div>
    </div>

    <script src="{{ static_url('dist/layui/layui.js') }}"></script>
    <script>
        function getXsrfToken() {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var c = cookies[i].trim();
                if (c.indexOf('_xsrf=') === 0) return c.substring(6);
            }
            return '';
        }

        var selectedRoleId = 0;

        layui.use(['layer', 'form'], function(){
            var layer = layui.layer;
            var form = layui.form;
            var $ = layui.jquery;

            // 加载角色列表
            $.getJSON('/admin/permission/role_list', function(roles){
                var html = '';
                $.each(roles, function(i, r){
                    html += '<div class="role-item" data-id="' + r.id + '" style="padding:8px 12px;cursor:pointer;border-radius:4px;margin-bottom:4px;">';
                    html += '<i class="layui-icon layui-icon-user"></i> ' + r.name;
                    html += '<span style="float:right;color:#999;font-size:12px;">' + r.code + '</span></div>';
                });
                $('#roleList').html(html);

                // 点击选择角色
                $('.role-item').on('click', function(){
                    $('.role-item').css({background:'', color:''});
                    $(this).css({background:'#3b7cff', color:'#fff'});
                    selectedRoleId = $(this).data('id');
                    var roleName = $(this).text().trim();
                    $('#currentRoleName').text('（' + roleName.split(' ')[0] + '）');
                    $('#btnSavePerm').removeAttr('disabled');
                    loadFeatureTree(selectedRoleId);
                });
            });

            // 加载功能树
            function loadFeatureTree(roleId){
                $.getJSON('/admin/permission/feature_tree?role_id=' + roleId, function(tree){
                    var html = '';
                    $.each(tree, function(i, parent){
                        html += '<div class="feature-parent">';
                        html += '<label><input type="checkbox" lay-filter="parentChk" data-id="' + parent.id + '"';
                        var allChecked = true;
                        $.each(parent.children, function(j, child){
                            if(!child.checked) allChecked = false;
                        });
                        if(allChecked && parent.children.length > 0) html += ' checked';
                        html += ' lay-skin="primary"> <span>' + parent.name + '</span></label>';
                        html += '<div class="feature-child">';
                        $.each(parent.children, function(j, child){
                            html += '<div class="feature-item">';
                            html += '<label><input type="checkbox" name="feature_ids" value="' + child.id + '" lay-skin="primary"';
                            if(child.checked) html += ' checked';
                            html += '> ' + child.name + '</label>';
                            html += '</div>';
                        });
                        html += '</div></div>';
                    });
                    if(tree.length === 0){
                        html = '<div style="color:#999;text-align:center;padding:40px 0;">请先到功能管理添加功能模块</div>';
                    }
                    $('#featureTree').html(html);
                    form.render('checkbox');
                });
            }

            // 全选/取消
            $(document).on('change', 'input[lay-filter="parentChk"]', function(){
                var checked = $(this).prop('checked');
                $(this).closest('.feature-parent').find('input[name="feature_ids"]').prop('checked', checked);
                form.render('checkbox');
            });

            // 子项变化联动父级
            $(document).on('change', 'input[name="feature_ids"]', function(){
                var parent = $(this).closest('.feature-parent');
                var all = parent.find('input[name="feature_ids"]');
                var checked = parent.find('input[name="feature_ids"]:checked');
                var parentChk = parent.find('input[lay-filter="parentChk"]');
                parentChk.prop('checked', all.length === checked.length);
                form.render('checkbox');
            });

            // 保存权限
            $('#btnSavePerm').on('click', function(){
                if(!selectedRoleId){
                    layer.msg('请先选择角色', {icon: 2});
                    return;
                }
                var ids = [];
                $('input[name="feature_ids"]:checked').each(function(){
                    ids.push($(this).val());
                });
                $.post('/admin/permission/save', {
                    role_id: selectedRoleId,
                    feature_ids: ids.join(','),
                    _xsrf: getXsrfToken()
                }, function(res){
                    if(res.code === 0){
                        layer.msg('保存成功', {icon: 1});
                        loadFeatureTree(selectedRoleId);
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
            });
        });
    </script>
</body>
</html>
