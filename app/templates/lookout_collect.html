<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        /* ===== 银河科幻风格 - 独立layui ===== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #05080f;
            color: #c8d6e5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* 星云背景粒子 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(88, 28, 255, .08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 210, 255, .06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(168, 85, 247, .05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #05080f; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #581cff, #00d2ff); border-radius: 3px; }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== 顶部导航 ===== */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 16px;
            border-bottom: 1px solid rgba(88, 28, 255, .15);
        }
        .top-nav .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #581cff, #00d2ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(88, 28, 255, .3);
        }
        .top-nav .logo span { font-weight: 400; opacity: .5; }
        .top-nav .nav-links { display: flex; gap: 16px; align-items: center; }
        .top-nav .nav-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all .3s;
        }
        .top-nav .nav-links a:hover,
        .top-nav .nav-links a.active {
            color: #00d2ff;
            background: rgba(0, 210, 255, .08);
        }

        /* ===== 搜索引擎区 ===== */
        .search-hero {
            text-align: center;
            padding: 60px 0 40px;
        }
        .search-hero .hero-title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #581cff, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .search-hero .hero-sub {
            color: #475569;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .search-box {
            display: flex;
            max-width: 640px;
            margin: 0 auto;
            background: rgba(10, 14, 26, .8);
            border: 1px solid rgba(88, 28, 255, .25);
            border-radius: 16px;
            overflow: hidden;
            transition: all .3s;
            box-shadow: 0 0 40px rgba(88, 28, 255, .08);
        }
        .search-box:focus-within {
            border-color: rgba(0, 210, 255, .5);
            box-shadow: 0 0 60px rgba(0, 210, 255, .12);
        }
        .search-box input {
            flex: 1;
            padding: 16px 24px;
            background: transparent;
            border: none;
            outline: none;
            color: #e2e8f0;
            font-size: 16px;
            font-family: inherit;
        }
        .search-box input::placeholder { color: #334155; }
        .search-box button {
            padding: 0 28px;
            background: linear-gradient(135deg, #581cff, #00d2ff);
            border: none;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .search-box button:hover {
            background: linear-gradient(135deg, #6b2fff, #1ad6ff);
            box-shadow: 0 0 30px rgba(88, 28, 255, .3);
        }
        .search-box button:disabled {
            opacity: .5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ===== 采集源选择面板 ===== */
        .source-panel {
            background: rgba(10, 14, 26, .6);
            border: 1px solid rgba(88, 28, 255, .12);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }
        .source-panel .panel-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .source-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .source-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(88, 28, 255, .12);
            border-radius: 10px;
            cursor: pointer;
            transition: all .3s;
            user-select: none;
        }
        .source-toggle:hover { border-color: rgba(0, 210, 255, .3); background: rgba(0, 210, 255, .05); }
        .source-toggle.active { border-color: #581cff; background: rgba(88, 28, 255, .1); }
        .source-toggle .toggle-indicator {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            transition: all .3s;
            position: relative;
        }
        .source-toggle.active .toggle-indicator {
            background: #581cff;
            box-shadow: 0 0 12px rgba(88, 28, 255, .5);
        }
        .source-toggle.active .toggle-indicator::after {
            content: '✓';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
        }
        .source-toggle .source-name {
            font-size: 13px;
            font-weight: 500;
            color: #c8d6e5;
        }
        .source-toggle .source-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(0, 210, 255, .1);
            color: #00d2ff;
        }

        /* ===== 参数配置 ===== */
        .config-row {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .config-row label {
            font-size: 13px;
            color: #64748b;
        }
        .config-row input[type="number"] {
            width: 80px;
            padding: 8px 12px;
            background: rgba(10,14,26,.8);
            border: 1px solid rgba(88,28,255,.2);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            text-align: center;
        }
        .config-row input[type="number"]:focus {
            border-color: #00d2ff;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
            padding: 12px 16px;
            background: rgba(10, 14, 26, .4);
            border-radius: 10px;
            border: 1px solid rgba(88, 28, 255, .08);
        }
        .status-bar .status-text {
            font-size: 13px;
            color: #64748b;
        }
        .status-bar .status-text .highlight {
            color: #00d2ff;
            font-weight: 600;
        }
        .status-bar .count-badge {
            padding: 4px 14px;
            border-radius: 20px;
            background: rgba(88, 28, 255, .15);
            color: #a78bfa;
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== 采集结果 - 橱窗网格 ===== */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }
        @media (max-width: 900px) {
            .result-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .result-grid { grid-template-columns: 1fr; }
        }

        .result-card {
            background: rgba(10, 14, 26, .7);
            border: 1px solid rgba(88, 28, 255, .1);
            border-radius: 14px;
            padding: 18px;
            transition: all .3s;
            position: relative;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        .result-card:hover {
            border-color: rgba(0, 210, 255, .3);
            box-shadow: 0 0 30px rgba(88, 28, 255, .1);
            transform: translateY(-3px);
        }
        .result-card.selected {
            border-color: #581cff;
            box-shadow: 0 0 30px rgba(88, 28, 255, .2), inset 0 0 30px rgba(88, 28, 255, .05);
        }
        .result-card .card-check {
            position: absolute;
            top: 12px; right: 12px;
            width: 22px; height: 22px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,.15);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: transparent;
            transition: all .3s;
        }
        .result-card.selected .card-check {
            background: #581cff;
            border-color: #581cff;
            color: #fff;
            box-shadow: 0 0 12px rgba(88, 28, 255, .4);
        }
        .result-card .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            padding-right: 30px;
        }
        .result-card .card-summary {
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .result-card .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #475569;
        }
        .result-card .card-meta .card-source {
            color: #581cff;
            font-weight: 500;
        }

        /* 全选栏 */
        .select-all-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 0;
        }
        .select-all-bar .check-all-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border: 1px solid rgba(88,28,255,.2);
            border-radius: 8px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            transition: all .3s;
        }
        .select-all-bar .check-all-btn:hover {
            border-color: #581cff;
            color: #a78bfa;
        }
        .select-all-bar .save-btn {
            padding: 8px 22px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s;
            font-family: inherit;
        }
        .select-all-bar .save-btn:hover {
            box-shadow: 0 0 25px rgba(16, 185, 129, .3);
            transform: translateY(-2px);
        }
        .select-all-bar .save-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state .empty-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: .3;
        }
        .empty-state .empty-text {
            font-size: 16px;
            color: #475569;
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid rgba(88,28,255,.2);
            border-top-color: #581cff;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            animation: toastIn .3s ease;
            backdrop-filter: blur(10px);
        }
        .toast.success {
            background: linear-gradient(135deg, rgba(16,185,129,.9), rgba(5,150,105,.9));
            border: 1px solid rgba(16,185,129,.3);
        }
        .toast.error {
            background: linear-gradient(135deg, rgba(239,68,68,.9), rgba(220,38,38,.9));
            border: 1px solid rgba(239,68,68,.3);
        }
        .toast.info {
            background: linear-gradient(135deg, rgba(88,28,255,.9), rgba(0,210,255,.9));
            border: 1px solid rgba(88,28,255,.3);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(40px) scale(.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="logo">🔭 瞭望 <span>· 智能数据采集</span></div>
            <div class="nav-links">
                <a href="/admin/lookout/source">采集源管理</a>
                <a href="javascript:;" class="active">瞭望采集</a>
                <a href="/admin/lookout/deep">AI深度分析</a>
                <a href="/admin/lookout/warehouse">数据仓库</a>
            </div>
        </div>

        <!-- 搜索区域 -->
        <div class="search-hero">
            <div class="hero-title">捕捉您关心的信息</div>
            <div class="hero-sub">输入关键词，选择采集源，一键获取互联网数据</div>
            <div class="search-box">
                <input type="text" id="keywordInput" placeholder="输入关键词，如：西华大学、人工智能、新能源..." autofocus>
                <button id="collectBtn" onclick="startCollect()">开始采集</button>
            </div>
        </div>

        <!-- 采集源选择 -->
        <div class="source-panel">
            <div class="panel-title">📡 选择采集源</div>
            <div class="source-toggles" id="sourceToggles"></div>
            <div class="config-row">
                <label>单次采集条数</label>
                <input type="number" id="collectCount" value="10" min="1" max="50">
                <span style="font-size:12px;color:#475569;">（与URL分页参数同步）</span>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar" id="statusBar" style="display:none;">
            <div class="status-text" id="statusText">采集完成，共获取 <span class="highlight" id="totalCount">0</span> 条数据</div>
            <div class="count-badge" id="countBadge">已选 0 条</div>
        </div>

        <!-- 全选/保存 -->
        <div class="select-all-bar" id="actionBar" style="display:none;">
            <button class="check-all-btn" onclick="toggleSelectAll()">
                <span id="selectAllIcon">☐</span> 全选
            </button>
            <button class="save-btn" id="saveSelectedBtn" onclick="saveSelected()" disabled>
                💾 保存到数据仓库
            </button>
        </div>

        <!-- 结果橱窗网格 -->
        <div class="result-grid" id="resultGrid">
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <div class="empty-text">输入关键词开始采集，结果将在这里展示</div>
            </div>
        </div>
    </div>

    <script>
    var collectedData = [];
    var selectedIds = new Set();
    var sourceList = [];
    var isCollecting = false;

    document.addEventListener('DOMContentLoaded', function(){
        loadSources();
        document.getElementById('keywordInput').addEventListener('keydown', function(e){
            if(e.key === 'Enter' && !isCollecting) startCollect();
        });
    });

    // ===== 加载采集源 =====
    function loadSources(){
        fetch('/admin/lookout/source/active')
            .then(r => r.json())
            .then(function(data){
                sourceList = data.items || [];
                var html = '';
                sourceList.forEach(function(s, idx){
                    html += '<div class="source-toggle' + (idx === 0 ? ' active' : '') + '" onclick="toggleSource(this, ' + s.id + ')" data-id="' + s.id + '">';
                    html += '  <div class="toggle-indicator"></div>';
                    html += '  <span class="source-name">' + escapeHtml(s.name) + '</span>';
                    html += '  <span class="source-badge">' + (s.page_size || 10) + '条/页</span>';
                    html += '</div>';
                });
                document.getElementById('sourceToggles').innerHTML = html || '<div style="color:#475569;font-size:13px;">暂无采集源，请先在 <a href="/admin/lookout/source" style="color:#00d2ff;">采集源管理</a> 中添加</div>';
            });
    }

    function toggleSource(el, id){
        el.classList.toggle('active');
    }

    function getActiveSourceIds(){
        var ids = [];
        document.querySelectorAll('.source-toggle.active').forEach(function(el){
            ids.push(parseInt(el.dataset.id));
        });
        return ids;
    }

    // ===== 开始采集 =====
    function startCollect(){
        var keyword = document.getElementById('keywordInput').value.trim();
        var activeIds = getActiveSourceIds();

        if(!keyword){
            showToast('error', '请输入关键词');
            return;
        }
        if(activeIds.length === 0){
            showToast('error', '请至少选择一个采集源');
            return;
        }

        isCollecting = true;
        var btn = document.getElementById('collectBtn');
        btn.disabled = true;
        btn.textContent = '采集中...';

        collectedData = [];
        selectedIds = new Set();
        var grid = document.getElementById('resultGrid');
        grid.innerHTML = '<div class="empty-state"><div class="loading-spinner" style="width:40px;height:40px;border-width:3px;"></div><div class="empty-text" style="margin-top:16px;">正在采集数据...</div></div>';
        document.getElementById('statusBar').style.display = 'none';
        document.getElementById('actionBar').style.display = 'none';

        var count = parseInt(document.getElementById('collectCount').value) || 10;
        var promises = [];

        activeIds.forEach(function(sourceId){
            var p = fetch('/admin/lookout/collect/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-XSRFToken': getXsrfToken()
                },
                body: 'source_id=' + sourceId + '&keyword=' + encodeURIComponent(keyword) + '&count=' + count
            }).then(r => r.json());
            promises.push(p);
        });

        Promise.all(promises).then(function(results){
            var totalNew = 0;
            var totalFound = 0;
            results.forEach(function(r){
                if(r.code === 0){
                    totalNew += r.count || 0;
                    totalFound += r.total || 0;
                }
            });

            // 重新加载新采集的数据
            return fetch('/admin/lookout/warehouse/list?page=1&page_size=100&keyword=' + encodeURIComponent(keyword))
                .then(r => r.json())
                .then(function(wareData){
                    collectedData = wareData.items || [];
                    renderResults(collectedData);
                    isCollecting = false;
                    btn.disabled = false;
                    btn.textContent = '开始采集';

                    var statusBar = document.getElementById('statusBar');
                    statusBar.style.display = 'flex';
                    document.getElementById('totalCount').textContent = collectedData.length;
                    document.getElementById('statusText').innerHTML = '采集完成，本次获取 <span class="highlight">' + totalFound + '</span> 条，新增 <span class="highlight">' + totalNew + '</span> 条';
                    document.getElementById('actionBar').style.display = 'flex';
                    updateCountBadge();

                    showToast('success', '采集完成！共 ' + collectedData.length + ' 条数据');
                });
        }).catch(function(err){
            isCollecting = false;
            btn.disabled = false;
            btn.textContent = '开始采集';
            var grid = document.getElementById('resultGrid');
            grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">采集失败: ' + err.message + '</div></div>';
            showToast('error', '采集失败: ' + err.message);
        });
    }

    // ===== 渲染结果 =====
    function renderResults(items){
        var grid = document.getElementById('resultGrid');
        if(!items || items.length === 0){
            grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">未找到相关数据</div></div>';
            return;
        }

        var html = '';
        items.forEach(function(item, idx){
            var selected = selectedIds.has(item.id) ? ' selected' : '';
            html += '<div class="result-card' + selected + '" onclick="toggleCardSelect(' + item.id + ')">';
            html += '  <div class="card-check">' + (selected ? '✓' : '') + '</div>';
            html += '  <div class="card-title">' + escapeHtml(item.title || '无标题') + '</div>';
            html += '  <div class="card-summary">' + escapeHtml(item.summary || item.content || '暂无摘要') + '</div>';
            html += '  <div class="card-meta">';
            html += '    <span class="card-source">' + escapeHtml(item.source_name || '未知源') + '</span>';
            html += '    <span>' + (item.publish_time || item.create_at || '') + '</span>';
            html += '  </div>';
            html += '</div>';
        });
        grid.innerHTML = html;
    }

    function toggleCardSelect(id){
        if(selectedIds.has(id)){
            selectedIds.delete(id);
        } else {
            selectedIds.add(id);
        }
        renderResults(collectedData);
        updateCountBadge();
    }

    function toggleSelectAll(){
        if(selectedIds.size === collectedData.length){
            selectedIds.clear();
        } else {
            collectedData.forEach(function(item){ selectedIds.add(item.id); });
        }
        renderResults(collectedData);
        updateCountBadge();
    }

    function updateCountBadge(){
        document.getElementById('countBadge').textContent = '已选 ' + selectedIds.size + ' 条';
        var btn = document.getElementById('saveSelectedBtn');
        btn.disabled = selectedIds.size === 0;
    }

    // ===== 保存到数据仓库 =====
    function saveSelected(){
        if(selectedIds.size === 0){
            showToast('error', '请先选择要保存的数据');
            return;
        }

        // 数据已经在 lookout_records 表中了，采集时已自动保存
        // 这里只是提示用户保存成功
        showToast('success', '已保存 ' + selectedIds.size + ' 条数据到数据仓库');
        document.getElementById('selectAllIcon').textContent = '☐';
    }

    function getXsrfToken(){
        var match = document.cookie.match(/_xsrf=([^;]+)/);
        return match ? match[1] : '';
    }

    function showToast(type, msg){
        var div = document.createElement('div');
        div.className = 'toast ' + type;
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(function(){ div.remove(); }, 3000);
    }

    function escapeHtml(str){
        if(!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    </script>
</body>
</html>
