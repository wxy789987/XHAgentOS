<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
</head>
<body class="layui-layout-body">
    <div class="layui-layout layui-layout-admin">
        <!-- 顶部导航 -->
        <div class="layui-header">
            <div class="layui-logo">XHAgentOS · 管理后台</div>
            <div class="admin-header-right">
                <span>{{ username }}</span>
                <a href="/auth/logout">退出</a>
            </div>
        </div>

        <!-- 左侧菜单 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree">
                    <li class="layui-nav-item">
                        <a href="/admin/user" target="workspace">
                            <i class="layui-icon layui-icon-user"></i> 用户管理
                        </a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;" target="workspace">
                            <i class="layui-icon layui-icon-set"></i> 功能管理
                        </a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;" target="workspace">
                            <i class="layui-icon layui-icon-auz"></i> 角色管理
                        </a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;" target="workspace">
                            <i class="layui-icon layui-icon-password"></i> 权限管理
                        </a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;" target="workspace">
                            <i class="layui-icon layui-icon-engine"></i> 模型引擎
                        </a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;" target="workspace">
                            <i class="layui-icon layui-icon-app"></i> 数据仓库
                        </a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;" target="workspace">
                            <i class="layui-icon layui-icon-set"></i> 系统设置
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 右侧工作区 -->
        <div class="layui-body">
            <iframe name="workspace" src="/admin/user" frameborder="0"></iframe>
        </div>
    </div>

    <script src="{{ static_url('dist/layui/layui.js') }}"></script>
    <script>
        layui.use('element', function(){
            var element = layui.element;
        });
    </script>
</body>
</html>
