<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
</head>
<body class="layui-layout-body">
    <div class="layui-layout layui-layout-admin">
        <!-- 顶部导航 -->
        <div class="layui-header">
            <div class="layui-logo">XHAgentOS · 管理后台</div>
            <div class="admin-header-right">
                <span>{{ username }}</span>
                <a href="/auth/logout">退出</a>
            </div>
        </div>

        <!-- 左侧菜单 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll" id="sideMenu">
                <ul class="layui-nav layui-nav-tree" id="navMenu"></ul>
            </div>
        </div>

        <!-- 右侧工作区 -->
        <div class="layui-body">
            <iframe name="workspace" src="/admin/dashboard" frameborder="0" id="workspace"></iframe>
        </div>
    </div>

    <script src="{{ static_url('dist/layui/layui.js') }}"></script>
    <script>
        layui.use(['element', 'jquery'], function(){
            var element = layui.element;
            var $ = layui.jquery;

            // 动态加载菜单
            $.getJSON('/admin/feature/menu', function(menus){
                var html = '';
                $.each(menus, function(i, item){
                    // 跳过没有子菜单且没有URL的无效菜单项（避免iframe嵌套加载）
                    if((!item.children || item.children.length === 0) && (!item.url || item.url === '')){
                        return;
                    }
                    if(item.children && item.children.length > 0){
                        html += '<li class="layui-nav-item layui-nav-itemed">';
                        html += '<a href="javascript:;"><i class="layui-icon ' + item.icon + '"></i> ' + item.name + '</a>';
                        html += '<dl class="layui-nav-child">';
                        $.each(item.children, function(j, child){
                            html += '<dd><a href="' + child.url + '" target="workspace"><i class="layui-icon ' + child.icon + '"></i> ' + child.name + '</a></dd>';
                        });
                        html += '</dl></li>';
                    } else {
                        html += '<li class="layui-nav-item">';
                        html += '<a href="' + item.url + '" target="workspace"><i class="layui-icon ' + item.icon + '"></i> ' + item.name + '</a>';
                        html += '</li>';
                    }
                });
                $('#navMenu').html(html);
                element.render('nav');
            });
        });
    </script>
</body>
</html>
