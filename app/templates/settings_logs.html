<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
    <style>
        .log-container { height:500px; overflow-y:auto; font-size:12px; background:#1e1e1e; color:#d4d4d4; padding:15px; border-radius:4px; font-family:Consolas,monospace; line-height:1.8; }
        .log-line { color:#888; margin-right:8px; }
    </style>
</head>
<body style="background:#f2f2f2;">
<div class="main-container">
    <div class="layui-card">
        <div class="layui-card-header">
            <h3>系统日志</h3>
            <div class="layui-btn-group pull-right">
                <button class="layui-btn layui-btn-sm" onclick="location.reload()"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
            </div>
        </div>
        <div class="layui-card-body">
            <div class="log-container">
                {% if logs %}
                    {% for log in logs %}
                    <div><span class="log-line">[{{ log["line"] }}]</span> {{ log["content"] }}</div>
                    {% end %}
                {% else %}
                    <div style="text-align:center;padding:50px;color:#666;">暂无日志记录</div>
                {% end %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
