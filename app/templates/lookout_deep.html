<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <style>
        body { background: #f2f2f2; padding: 15px; }
        .deep-container { max-width: 1400px; margin: 0 auto; }
        .deep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-card { display: flex; gap: 16px; margin-bottom: 20px; }
        .stat-item { background: #fff; padding: 16px 24px; border-radius: 8px; flex: 1; display: flex; align-items: center; gap: 12px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .stat-icon.total { background: linear-gradient(135deg, #3b7cff, #6ba3ff); color: #fff; }
        .stat-icon.completed { background: linear-gradient(135deg, #5fb878, #8dda9e); color: #fff; }
        .stat-icon.pending { background: linear-gradient(135deg, #ffb800, #ffce3c); color: #fff; }
        .stat-icon.failed { background: linear-gradient(135deg, #ff5722, #ff7043); color: #fff; }
        .stat-info h3 { font-size: 24px; margin: 0; color: #333; }
        .stat-info p { margin: 4px 0 0; color: #999; font-size: 13px; }
        .log-container { background: #1e1e1e; color: #ccc; padding: 16px; border-radius: 6px; font-family: monospace; font-size: 13px; max-height: 450px; overflow-y: auto; }
        .log-item { margin-bottom: 4px; line-height: 1.5; }
        .log-success { color: #5fb878; }
        .log-error { color: #ff5722; }
        .log-info { color: #3b7cff; }
        .log-step { color: #ffb800; }
        .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b7cff, #5fb878); transition: width 0.3s ease; }
        .detail-modal { display: none; }
        .detail-content { max-height: 600px; overflow-y: auto; padding: 10px; }
        .detail-section { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 6px; }
        .detail-section h4 { margin-bottom: 8px; color: #333; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .detail-section p { margin: 0; line-height: 1.6; color: #666; }
        .deep-status-badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; }
        .deep-status-completed { background: #e6f7ff; color: #1890ff; }
        .deep-status-pending { background: #fff7e6; color: #fa8c16; }
        .deep-status-failed { background: #fff2f0; color: #ff4d4f; }
        .keyword-tag { display: inline-block; padding: 4px 10px; background: #e6f7ff; color: #1890ff; border-radius: 20px; font-size: 12px; margin-right: 6px; margin-bottom: 4px; }
        .analysis-type-card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #3b7cff; }
        .analysis-type-card h5 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .analysis-type-card p { margin: 0; color: #666; font-size: 13px; line-height: 1.6; }
        .overview-section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
        .overview-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .overview-card h4 { margin: 0 0 10px 0; color: #999; font-size: 13px; }
        .overview-card .value { font-size: 32px; font-weight: bold; color: #333; }
        .overview-card .value.success { color: #5fb878; }
        .overview-card .value.warning { color: #ffb800; }
        .empty-tip { text-align: center; padding: 60px 20px; color: #999; }
        .empty-tip i { font-size: 48px; display: block; margin-bottom: 15px; }
        .empty-tip p { font-size: 15px; }
        /* ===== 顶部导航 ===== */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 16px;
            border-bottom: 1px solid rgba(88, 28, 255, .15);
        }
        .top-nav .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #581cff, #00d2ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-nav .logo span { font-weight: 400; opacity: .5; }
        .top-nav .nav-links { display: flex; gap: 16px; align-items: center; }
        .top-nav .nav-links a {
            color: #64748b; text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 6px 14px; border-radius: 6px; transition: all .3s;
        }
        .top-nav .nav-links a:hover,
        .top-nav .nav-links a.active {
            color: #00d2ff; background: rgba(0, 210, 255, .08);
        }
    </style>
</head>
<body>
    <div class="deep-container">
        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="logo">🔭 瞭望 <span>· AI深度分析</span></div>
            <div class="nav-links">
                <a href="/admin/lookout/source">采集源管理</a>
                <a href="/admin/lookout/collect">瞭望采集</a>
                <a href="javascript:;" class="active">AI深度分析</a>
                <a href="/admin/lookout/warehouse">数据仓库</a>
            </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;margin-top:20px;">
            <h2 style="margin:0;font-size:20px;color:#333;"><i class="layui-icon layui-icon-search"></i> AI深度采集</h2>
            <button class="layui-btn layui-btn-normal" onclick="syncFromWarehouse()">
                <i class="layui-icon layui-icon-refresh"></i> 从数据仓库同步
            </button>
        </div>

        <div class="stats-card" id="statsCard">
            <div class="stat-item">
                <div class="stat-icon total"><i class="layui-icon layui-icon-file"></i></div>
                <div class="stat-info"><h3 id="statTotal">0</h3><p>总记录数</p></div>
            </div>
            <div class="stat-item">
                <div class="stat-icon completed"><i class="layui-icon layui-icon-check-circle"></i></div>
                <div class="stat-info"><h3 id="statCompleted">0</h3><p>已完成</p></div>
            </div>
            <div class="stat-item">
                <div class="stat-icon pending"><i class="layui-icon layui-icon-clock"></i></div>
                <div class="stat-info"><h3 id="statPending">0</h3><p>待处理</p></div>
            </div>
            <div class="stat-item">
                <div class="stat-icon failed"><i class="layui-icon layui-icon-close-circle"></i></div>
                <div class="stat-info"><h3 id="statFailed">0</h3><p>失败</p></div>
            </div>
        </div>

        <div class="layui-tab layui-tab-card" lay-filter="deepTab">
            <ul class="layui-tab-title">
                <li class="layui-this">采集列表</li>
                <li>采集日志</li>
                <li>分析报告</li>
            </ul>
            <div class="layui-tab-content" style="min-height:500px;">
                <!-- 采集列表 -->
                <div class="layui-tab-item layui-show">
                    <table class="layui-hide" id="deepList" lay-filter="deepList"></table>
                </div>
                <!-- 采集日志 -->
                <div class="layui-tab-item">
                    <div style="margin-bottom: 15px;">
                        <button class="layui-btn" onclick="startDeepCrawl()">
                            <i class="layui-icon layui-icon-play"></i> 开始采集选中记录
                        </button>
                        <button class="layui-btn layui-btn-primary" onclick="clearLogs()">
                            <i class="layui-icon layui-icon-delete"></i> 清空日志
                        </button>
                        <span id="logStatus" style="float:right;color:#999;font-size:13px;line-height:38px;"></span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width:0%"></div>
                    </div>
                    <div class="log-container" id="logContainer">
                        <div class="log-item">请先在"采集列表"中勾选要采集的记录，或点击"从数据仓库同步"按钮引入数据。</div>
                        <div class="log-item">然后点击"开始采集选中记录"按钮执行AI深度采集。</div>
                    </div>
                </div>
                <!-- 分析报告 -->
                <div class="layui-tab-item" id="analysisReport">
                    <div class="empty-tip">
                        <i class="layui-icon layui-icon-chart"></i>
                        <p>暂无分析数据，请先执行深度采集任务</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="detailModal" style="display:none;">
        <div class="detail-content">
            <div class="detail-section">
                <h4><i class="layui-icon layui-icon-file"></i> 标题</h4>
                <p id="detailTitle"></p>
            </div>
            <div class="detail-section">
                <h4><i class="layui-icon layui-icon-link"></i> 链接</h4>
                <p><a href="" id="detailUrl" target="_blank"></a></p>
            </div>
            <div class="detail-section">
                <h4><i class="layui-icon layui-icon-edit"></i> AI摘要</h4>
                <p id="detailSummary"></p>
            </div>
            <div class="detail-section">
                <h4><i class="layui-icon layui-icon-tags"></i> 关键词</h4>
                <div id="detailKeywords"></div>
            </div>
            <div class="analysis-type-card">
                <h5><i class="layui-icon layui-icon-bar-chart"></i> 深度分析</h5>
                <p id="detailAnalysis"></p>
            </div>
            <div class="analysis-type-card" style="border-left-color:#5fb878">
                <h5><i class="layui-icon layui-icon-set"></i> 数据特征分析</h5>
                <p id="detailFeatures"></p>
            </div>
            <div class="analysis-type-card" style="border-left-color:#ff5722">
                <h5><i class="layui-icon layui-icon-alert"></i> 异常值检测</h5>
                <p id="detailAnomalies"></p>
            </div>
            <div class="analysis-type-card" style="border-left-color:#ffb800">
                <h5><i class="layui-icon layui-icon-link"></i> 关联关系</h5>
                <p id="detailRelations"></p>
            </div>
            <div class="analysis-type-card" style="border-left-color:#a855f7">
                <h5><i class="layui-icon layui-icon-trend"></i> 分布趋势</h5>
                <p id="detailDistribution"></p>
            </div>
        </div>
    </div>

    <!-- 先加载 ECharts（本地文件，无 CDN 跨域/拦截问题） -->
    <script src="{{ static_url('dist/echarts/echarts.min.js') }}"></script>
    <!-- 再加载 LayUI -->
    <script src="{{ static_url('dist/layui/layui.js') }}"></script>

    <script type="text/html" id="deepBar">
        <a class="layui-btn layui-btn-xs" lay-event="retry">重新采集</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">删除</a>
    </script>

    <script>
    // ===== 唯一全局函数：读取 XSRF Token =====
    function getXsrfToken() {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var c = cookies[i].trim();
            if (c.indexOf('_xsrf=') === 0) return c.substring(6);
        }
        return '';
    }

    // ===== LayUI 初始化（在此之后 $, layer, echarts 均已就绪） =====
    layui.use(['table', 'layer', 'jquery', 'element'], function() {
        var table = layui.table;
        var layer = layui.layer;
        var element = layui.element;

        // 暴露到全局：让 onClick 等事件回调能使用 $
        window.$ = layui.jquery;
        window.layer = layer;
        window.layui = layui;

        var $ = window.$;

        // ===== 统计加载 =====
        function loadStats() {
            $.getJSON('/admin/lookout/deep/status', function(res) {
                if (res.code === 0) {
                    $('#statTotal').text(res.data.total || 0);
                    $('#statCompleted').text(res.data.completed || 0);
                    $('#statPending').text(res.data.pending || 0);
                    $('#statFailed').text(res.data.failed || 0);
                }
            });
        }

        // ===== 分析报告（ECharts 图表） =====
        function loadAnalysisReport() {
            $('#analysisReport').html(
                '<div style="text-align:center;padding:40px;color:#999;">' +
                '<i class="layui-icon layui-icon-loading-1 layui-anim layui-anim-rotate" style="font-size:48px;"></i>' +
                '<p>加载分析报告...</p></div>'
            );
            $.getJSON('/admin/lookout/deep/analysis', function(res) {
                if (res.code !== 0 || !res.data || !res.data.overview || !res.data.overview.total_records) {
                    $('#analysisReport').html(
                        '<div class="empty-tip"><i class="layui-icon layui-icon-chart"></i>' +
                        '<p>暂无分析数据，请先执行深度采集任务</p></div>'
                    );
                    return;
                }
                var data = res.data;
                var html = '';
                // 概览
                html += '<div class="overview-section">';
                html += '<div class="overview-card"><h4>总采集记录</h4><div class="value">' + data.overview.total_records + '</div></div>';
                html += '<div class="overview-card"><h4>已完成</h4><div class="value success">' + data.overview.completed_records + '</div></div>';
                html += '<div class="overview-card"><h4>完成率</h4><div class="value success">' + (data.overview.completion_rate || 0) + '%</div></div>';
                html += '<div class="overview-card"><h4>平均内容长度</h4><div class="value warning">' + (data.overview.avg_content_length || 0).toLocaleString() + '</div></div>';
                html += '</div>';
                // 图表
                html += '<div class="layui-row layui-col-space15">';
                html += '<div class="layui-col-md8"><div class="layui-card"><div class="layui-card-header"><i class="layui-icon layui-icon-trend"></i> 采集趋势（按天）</div><div class="layui-card-body"><div id="chartTrend" style="height:300px;"></div></div></div></div>';
                html += '<div class="layui-col-md4"><div class="layui-card"><div class="layui-card-header"><i class="layui-icon layui-icon-circle"></i> 状态分布</div><div class="layui-card-body"><div id="chartStatus" style="height:300px;"></div></div></div></div>';
                html += '</div>';
                html += '<div class="layui-row layui-col-space15">';
                html += '<div class="layui-col-md6"><div class="layui-card"><div class="layui-card-header"><i class="layui-icon layui-icon-tags"></i> 热门关键词 TOP15</div><div class="layui-card-body"><div id="chartKeywords" style="height:300px;"></div></div></div></div>';
                html += '<div class="layui-col-md6"><div class="layui-card"><div class="layui-card-header"><i class="layui-icon layui-icon-file"></i> 内容长度分布</div><div class="layui-card-body"><div id="chartLength" style="height:300px;"></div></div></div></div>';
                html += '</div>';
                html += '<div class="layui-row layui-col-space15">';
                html += '<div class="layui-col-md6"><div class="layui-card"><div class="layui-card-header"><i class="layui-icon layui-icon-group"></i> 来源分布</div><div class="layui-card-body"><div id="chartSource" style="height:280px;"></div></div></div></div>';
                html += '<div class="layui-col-md6"><div class="layui-card"><div class="layui-card-header"><i class="layui-icon layui-icon-info"></i> 分析类型说明</div><div class="layui-card-body"><div class="layui-row layui-col-space10">';
                if (data.analysis_summary && data.analysis_summary.analysis_types) {
                    var colors = ['#3b7cff','#5fb878','#ffb800','#ff5722','#a855f7','#06b6d4'];
                    $.each(data.analysis_summary.analysis_types, function(i, item) {
                        html += '<div class="layui-col-md6"><div class="analysis-type-card" style="border-left-color:'+colors[i]+'"><h5>'+item.name+'</h5><p>'+item.description+'</p></div></div>';
                    });
                }
                html += '</div></div></div></div></div>';

                $('#analysisReport').html(html);

                // 渲染 ECharts（本地加载，echarts 已全局可用）
                setTimeout(function() {
                    var ec = window.echarts || echarts;
                    if (!ec) return;
                    var chart1 = ec.init(document.getElementById('chartTrend'));
                    chart1.setOption({
                        tooltip: { trigger: 'axis' },
                        legend: { data: ['总记录', '已完成'], bottom: 0 },
                        grid: { left: 50, right: 20, top: 10, bottom: 40 },
                        xAxis: { type: 'category', data: $.map(data.charts.time_trend, function(d){return d.date;}), axisLabel: { rotate: 30, fontSize: 11 } },
                        yAxis: { type: 'value', minInterval: 1 },
                        series: [
                            { name: '总记录', type: 'line', data: $.map(data.charts.time_trend, function(d){return d.total;}), smooth: true, lineStyle: { color: '#3b7cff', width: 2 }, areaStyle: { color: 'rgba(59,124,255,0.1)' } },
                            { name: '已完成', type: 'line', data: $.map(data.charts.time_trend, function(d){return d.completed;}), smooth: true, lineStyle: { color: '#5fb878', width: 2 }, areaStyle: { color: 'rgba(95,184,120,0.1)' } }
                        ]
                    });
                    var cp = { '已完成': '#5fb878', '待爬取': '#ffb800', '待分析': '#3b7cff', '失败': '#ff5722' };
                    var chart2 = ec.init(document.getElementById('chartStatus'));
                    chart2.setOption({
                        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                        series: [{ type: 'pie', radius: ['40%', '70%'], center: ['50%', '45%'],
                            data: $.map(data.charts.status_distribution, function(d){return{value:d.value,name:d.name,itemStyle:{color:cp[d.name]||'#999'}};}),
                            label: { show: true, formatter: '{b}\n{d}%', fontSize: 11 }
                        }]
                    });
                    var chart3 = ec.init(document.getElementById('chartKeywords'));
                    chart3.setOption({
                        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                        grid: { left: 100, right: 20, top: 10, bottom: 20 },
                        xAxis: { type: 'value', minInterval: 1 },
                        yAxis: { type: 'category', data: $.map(data.top_keywords, function(d){return d.keyword;}).reverse(), axisLabel: { fontSize: 11 } },
                        series: [{ type: 'bar', data: $.map(data.top_keywords, function(d){return d.count;}).reverse(),
                            itemStyle: { color: new (ec.graphic || {}).LinearGradient(0,0,1,0,[{offset:0,color:'#3b7cff'},{offset:1,color:'#6ba3ff'}]) },
                            barMaxWidth: 20
                        }]
                    });
                    var chart4 = ec.init(document.getElementById('chartLength'));
                    chart4.setOption({
                        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                        grid: { left: 50, right: 20, top: 10, bottom: 40 },
                        xAxis: { type: 'category', data: $.map(data.charts.content_length_distribution, function(d){return d.name;}), axisLabel: { fontSize: 11 } },
                        yAxis: { type: 'value', minInterval: 1 },
                        series: [{ type: 'bar', data: $.map(data.charts.content_length_distribution, function(d){return d.value;}),
                            itemStyle: { color: new (ec.graphic || {}).LinearGradient(0,0,0,1,[{offset:0,color:'#ffb800'},{offset:1,color:'#ffce3c'}]) },
                            barMaxWidth: 30
                        }]
                    });
                    var chart5 = ec.init(document.getElementById('chartSource'));
                    var sc = ['#3b7cff','#5fb878','#ffb800','#ff5722','#a855f7','#06b6d4','#f472b6'];
                    chart5.setOption({
                        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                        series: [{ type: 'pie', radius: '60%',
                            data: $.map(data.charts.source_distribution, function(d,i){return{value:d.value,name:d.name,itemStyle:{color:sc[i%sc.length]}};}),
                            label: { show: true, formatter: '{b}\n{d}%', fontSize: 11 }
                        }]
                    });
                }, 300);
            });
        }

        // ===== 开始采集 =====
        function startDeepCrawl(recordIds) {
            var ids = recordIds || [];
            if (ids.length === 0) {
                try {
                    var checkStatus = window.tableIns && window.tableIns.checkStatus('deepTable');
                    if (checkStatus && checkStatus.data && checkStatus.data.length > 0) {
                        ids = $.map(checkStatus.data, function(d) { return d.record_id; });
                    }
                } catch(e) {}
                if (ids.length === 0) {
                    layer.msg('请先在采集列表中勾选要采集的记录', {icon: 2});
                    return;
                }
            }
            layer.load(1);
            $('#logContainer').html('<div class="log-item log-info">[开始] 正在进行AI深度采集，共 ' + ids.length + ' 条数据...</div>');
            $('#progressFill').css('width', '0%');
            $('#logStatus').text('正在采集...');
            $.post('/admin/lookout/deep/start', {record_ids: ids.join(','), _xsrf: getXsrfToken()}, function(res) {
                layer.closeAll('loading');
                if (res.code === 0 && res.data) {
                    var logs = res.data.logs || [];
                    var success = res.data.success || 0;
                    var total = res.data.total || ids.length;
                    $.each(logs, function(i, log) {
                        var cls = 'log-info';
                        if (log.indexOf('✅') !== -1) cls = 'log-success';
                        if (log.indexOf('❌') !== -1) cls = 'log-error';
                        if (log.indexOf('开始') !== -1 || log.indexOf('🕷') !== -1 || log.indexOf('🤖') !== -1) cls = 'log-step';
                        $('#logContainer').append('<div class="log-item ' + cls + '">' + log + '</div>');
                        $('#logContainer').scrollTop($('#logContainer')[0].scrollHeight);
                    });
                    var progress = total > 0 ? Math.round((success / total) * 100) : 0;
                    $('#progressFill').css('width', progress + '%');
                    $('#logContainer').append('<div class="log-item log-success">[完成] 采集结束，成功: ' + success + '/' + total + '</div>');
                    $('#logStatus').text('已完成: ' + success + '/' + total);
                    try { window.tableIns && window.tableIns.reload(); } catch(e) {}
                    loadStats();
                    loadAnalysisReport();
                } else {
                    layer.msg(res.msg || '采集失败', {icon: 2});
                    $('#logContainer').append('<div class="log-item log-error">[失败] ' + (res.msg || '未知错误') + '</div>');
                }
            }, 'json').fail(function(xhr) {
                layer.closeAll('loading');
                layer.msg('请求失败: ' + (xhr.statusText || '网络错误'), {icon: 2});
                $('#logContainer').append('<div class="log-item log-error">[错误] 请求失败: ' + (xhr.statusText || '网络错误') + '</div>');
            });
        }

        // ===== 从数据仓库同步 =====
        function syncFromWarehouse() {
            layer.load(1);
            $.post('/admin/lookout/deep/sync', {_xsrf: getXsrfToken()}, function(res) {
                layer.closeAll('loading');
                if (res.code === 0) {
                    var synced = res.data && res.data.synced || 0;
                    if (synced > 0) {
                        layer.msg('同步完成，新增 ' + synced + ' 条记录', {icon: 1});
                        try { window.tableIns && window.tableIns.reload(); } catch(e) {}
                        loadStats();
                    } else {
                        layer.msg('数据仓库中暂无未深度采集的记录', {icon: 0});
                    }
                } else {
                    layer.msg(res.msg || '同步失败', {icon: 2});
                }
            }, 'json').fail(function() {
                layer.closeAll('loading');
                layer.msg('同步请求失败', {icon: 2});
            });
        }

        // ===== 查看详情 =====
        function viewDetail(recordId) {
            $.getJSON('/admin/lookout/deep/get', {record_id: recordId}, function(res) {
                if (res.code === 0) {
                    var data = res.data;
                    $('#detailTitle').text(data.title || '');
                    $('#detailUrl').attr('href', data.url || '#').text(data.url || '');
                    $('#detailSummary').text(data.ai_summary || '暂无');
                    var keywords = data.ai_keywords || '';
                    if (keywords) {
                        var kwHtml = keywords.split(/[,，,;；]/).map(function(k) { k = k.trim(); return k ? '<span class="keyword-tag">' + k + '</span>' : ''; }).join('');
                        $('#detailKeywords').html(kwHtml || '暂无');
                    } else {
                        $('#detailKeywords').html('暂无');
                    }
                    $('#detailAnalysis').text(data.ai_analysis || '暂无');
                    $('#detailFeatures').text(data.ai_features || '暂无');
                    $('#detailAnomalies').text(data.ai_anomalies || '暂无');
                    $('#detailRelations').text(data.ai_relations || '暂无');
                    $('#detailDistribution').text(data.ai_distribution || '暂无');
                    layer.open({
                        type: 1, title: '深度采集详情', area: ['900px', '700px'],
                        content: $('#detailModal').html(), btn: ['关闭'],
                        success: function(layero) { layero.find('.detail-content').css('max-height', '580px'); }
                    });
                } else {
                    layer.msg('暂无深度采集数据，请先执行采集', {icon: 0});
                }
            });
        }

        // ===== 清空日志 =====
        function clearLogs() {
            $('#logContainer').html('<div class="log-item">日志已清空</div>');
            $('#progressFill').css('width', '0%');
            $('#logStatus').text('');
        }

        // ===== 暴露给全局（onClick 调用） =====
        window.startDeepCrawl = startDeepCrawl;
        window.syncFromWarehouse = syncFromWarehouse;
        window.viewDetail = viewDetail;
        window.clearLogs = clearLogs;
        window.loadAnalysisReport = loadAnalysisReport;
        window.loadStats = loadStats;

        // ===== 表格渲染 =====
        window.tableIns = table.render({
            elem: '#deepList',
            url: '/admin/lookout/deep/list',
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'id', title: 'ID', width: 70},
                {field: 'title', title: '标题', width: 220, templet: function(d) {
                    return '<a href="javascript:void(0)" onclick="viewDetail(' + d.record_id + ')" style="color:#3b7cff;">' + (d.title || '未命名') + '</a>';
                }},
                {field: 'url', title: '链接', width: 250, templet: function(d) {
                    return d.url ? '<a href="' + d.url + '" target="_blank" style="color:#10b981;">查看原文</a>' : '-';
                }},
                {field: 'status_text', title: '状态', width: 100, templet: function(d) {
                    var cls = 'deep-status-pending';
                    if (d.status_text == '已完成') cls = 'deep-status-completed';
                    if (d.status_text == '爬取失败' || d.status_text == '分析失败') cls = 'deep-status-failed';
                    return '<span class="deep-status-badge ' + cls + '">' + (d.status_text || '待处理') + '</span>';
                }},
                {field: 'content_length', title: '内容长度', width: 90, sort: true},
                {field: 'create_at', title: '创建时间', width: 160},
                {fixed: 'right', title: '操作', width: 130, toolbar: '#deepBar'}
            ]],
            page: {limit: 15, limits: [15, 30, 50]},
            height: 480,
            id: 'deepTable',
            parseData: function(res) {
                return { code: res.code, msg: res.msg, count: (res.data && res.data.total) || 0, data: (res.data && res.data.items) || [] };
            }
        });

        // ===== 工具栏事件 =====
        table.on('tool(deepList)', function(obj) {
            var data = obj.data;
            if (obj.event === 'delete') {
                layer.confirm('确定要删除这条深度采集记录吗？', function(index) {
                    $.post('/admin/lookout/deep/delete', {record_id: data.record_id, _xsrf: getXsrfToken()}, function(res) {
                        if (res.code === 0) {
                            layer.msg('删除成功');
                            window.tableIns.reload();
                            loadStats();
                            loadAnalysisReport();
                        } else {
                            layer.msg(res.msg || '删除失败', {icon: 2});
                        }
                    }, 'json');
                    layer.close(index);
                });
            } else if (obj.event === 'retry') {
                startDeepCrawl([data.record_id]);
            }
        });

        // ===== 标签切换 =====
        element.on('tab(deepTab)', function(data) {
            if (data.index === 2) loadAnalysisReport();
        });

        // ===== 初始化加载 =====
        loadStats();
        loadAnalysisReport();
    });
    </script>
</body>
</html>
