<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('css/login.css') }}">
    <style>
        .role-select { width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; outline:none; background:#f9f9f9; color:#333; cursor:pointer; transition:border 0.3s; }
        .role-select:focus { border-color:#52c41a; }
        .login-link { text-align:center; margin-top:12px; font-size:13px; color:#888; }
        .login-link a { color:#52c41a; text-decoration:none; }
        .login-link a:hover { text-decoration:underline; }
        .register-tip { text-align:center; font-size:12px; color:#aaa; margin-top:8px; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-card" style="min-height:420px;">
                <div class="login-header">
                    <h1>XHAgentOS</h1>
                    <p>创建新账号</p>
                </div>
                <form class="login-form" method="post" action="/auth/register" id="registerForm">
                    {% module xsrf_form_html() %}
                    {% if error %}
                    <div class="error-msg show">{{ error }}</div>
                    {% end %}
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <div class="input-wrapper">
                            <input type="text" id="username" name="username" placeholder="2-20个字符" value="" autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="至少4位密码" value="" autocomplete="new-password">
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="hidden" name="role_id" value="2">
                        <div style="text-align:center;font-size:12px;color:#999;padding:4px 0;">注册为：普通用户</div>
                    </div>
                    <button type="submit" class="login-btn">注 册</button>
                </form>
                <div class="login-link">
                    已有账号？<a href="/auth/login">立即登录</a>
                </div>
                <div class="login-footer">
                    <p>XHAgentOS v1.0 · 企业级智能数据平台</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
